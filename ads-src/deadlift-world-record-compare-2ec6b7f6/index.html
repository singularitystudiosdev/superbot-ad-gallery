<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make thumbnails for “Deadlift World Record” · Gemini, Midjourney, Perplexity, Superbot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="content">
    <section class="prompt" aria-label="Prompt">
      <span class="prompt-text">Make thumbnails for “Deadlift World Record”</span>
      <span class="send" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
      </span>
    </section>

    <section class="grid">
      <article class="card">
        <header><img class="icon" src="assets/icon-gemini.png" alt=""><h2>Gemini</h2></header>
        <div class="shot"><img src="assets/shot-gemini.jpg" alt="Gemini result: a strongman loading an atlas stone under 'Strongman Stunts' text"></div>
      </article>
      <article class="card">
        <header><img class="icon" src="assets/icon-midjourney.png" alt=""><h2>Midjourney</h2></header>
        <div class="shot"><img src="assets/shot-midjourney.jpg" alt="Midjourney result: a strongman celebrating under 'First World Title' text"></div>
      </article>
      <article class="card">
        <header><img class="icon" src="assets/icon-perplexity.png" alt=""><h2>Perplexity</h2></header>
        <div class="shot"><img src="assets/shot-perplexity.jpg" alt="Perplexity result: a neon gym lifter under 'AI Gains! Cyber Lifting' text"></div>
      </article>
      <article class="card card-superbot">
        <header><span class="icon icon-superbot"><img src="assets/mascot.png" alt=""></span><h2>Superbot</h2></header>
        <div class="shot"><img src="assets/shot-superbot.jpg" alt="Superbot result: a strongman deadlifting a bar loaded with stacked tires"></div>
      </article>
    </section>
  </div>
</main>
</body>
</html>

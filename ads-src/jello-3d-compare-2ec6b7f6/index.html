<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make me 3D jello · Gemini, Muse, Devin, Superbot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="content">
    <section class="prompt" aria-label="Prompt">
      <span class="prompt-text">Make me 3D jello</span>
      <span class="send" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
      </span>
    </section>

    <section class="grid">
      <article class="card">
        <header><img class="icon" src="assets/icon-gemini.png" alt=""><h2>Gemini</h2></header>
        <div class="shot"><img src="assets/shot-gemini.png" alt="Gemini result: a chat reply with a block of HTML code"></div>
      </article>
      <article class="card">
        <header><img class="icon" src="assets/icon-muse.png" alt=""><h2>Muse</h2></header>
        <div class="shot"><img src="assets/shot-muse.png" alt="Muse result: a flat pink jello dome on a plate"></div>
      </article>
      <article class="card">
        <header><img class="icon" src="assets/icon-devin.png" alt=""><h2>Devin</h2></header>
        <div class="shot"><img src="assets/shot-devin.png" alt="Devin result: a faceted red jello on a plate in a dark scene"></div>
      </article>
      <article class="card card-superbot">
        <header><span class="icon icon-superbot"><img src="assets/mascot.png" alt=""></span><h2>Superbot</h2></header>
        <div class="shot"><img src="assets/shot-superbot.png" alt="Superbot result: a glossy tiered red jello mold"></div>
      </article>
    </section>
  </div>
</main>
</body>
</html>

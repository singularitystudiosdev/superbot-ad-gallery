<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUPERBOT</title>
<style>
  /* ---------- page shell only ---------- */
  html, body { height: 100%; margin: 0; }
  body {
    background: #0a0a0a;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  #stars {
    position: fixed; inset: 0; z-index: 0;
    width: 100%; height: 100%;
  }
  .stage {
    position: relative; z-index: 1;
    min-height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 30px; padding: 56px 16px; box-sizing: border-box;
  }

  /* ---------- shared: the ring technique, verbatim geometry ---------- */
  @property --superbot-angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @keyframes superbot-spin { to { --superbot-angle: 360deg; } }

  /* ---------- text ---------- */
  .sb-title {
    font-size: 34px; font-weight: 700; letter-spacing: 0.35em; text-indent: 0.35em;
    color: #b5b5b5;
    user-select: none;
  }
  .sb-tag {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    color: #5f5f5f; user-select: none;
  }
  .sb-caption {
    font-size: 11px; letter-spacing: 0.08em; color: #3a3a3a; user-select: none;
  }

  /* ---------- textbox ---------- */
  .sb-input-wrap {
    position: relative; display: inline-flex; align-items: center; gap: 7px;
    height: 34px; padding: 0 16px; border-radius: 999px;
    background: #050505; isolation: isolate;
  }
  .sb-input-wrap::before {
    content: ''; position: absolute; inset: -1px; border-radius: 999px; padding: 1px;
    background: conic-gradient(from var(--superbot-angle), #191919 0deg, #1c1c1c 40deg, #191919 120deg, #191919 360deg);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    animation: superbot-spin 3s linear infinite; pointer-events: none; z-index: 1;
    transition: filter 0.3s ease;
  }
  .sb-input-wrap:focus-within::before {
    /* focused: same faint ring as idle — no sheen, no brightening */
  }
  .sb-input {
    background: transparent; border: none; outline: none;
    width: 300px; font: inherit; font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    color: #f0f0f0; caret-color: #f0f0f0;
  }
  .sb-input::placeholder { color: #5f5f5f; }
  .sb-input-wrap .sb-led {
    display: inline-block; width: 4px; height: 4px; flex: none;
    border-radius: 50%; background: #3a3a3a; box-shadow: none;
    transition: background 0.25s ease, box-shadow 0.25s ease;
  }
  .sb-input-wrap.has-text .sb-led {
    background: #f0f0f0; box-shadow: 0 0 4px rgba(255,255,255,0.7);
  }

  /* ---------- claude code panel ---------- */
  .sb-panel {
    position: relative; width: min(660px, 92vw);
    background: #050505; border-radius: 12px; isolation: isolate;
  }
  .sb-panel::before {
    content: ''; position: absolute; inset: -1px; border-radius: 13px; padding: 1px;
    background: conic-gradient(from var(--superbot-angle), #191919 0deg, #3a3a3a 40deg, #191919 120deg, #191919 360deg);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    animation: superbot-spin 3s linear infinite; pointer-events: none; z-index: 1;
    transition: filter 0.3s ease;
  }
  .sb-panel:hover::before { filter: brightness(1.4); }
  .cc-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 10px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #f0f0f0;
  }
  .cc-head .cc-dim { color: #5f5f5f; font-weight: 400; }
  .cc-body {
    padding: 4px 16px 12px; min-height: 180px; max-height: 300px; overflow-y: auto;
    font-size: 11px; letter-spacing: 0.04em; line-height: 1.9;
  }
  .cc-line { color: #f0f0f0; white-space: pre-wrap; word-break: break-word; }
  .cc-user { color: #f0f0f0; }
  .cc-user::before { content: '> '; color: #5f5f5f; }
  .cc-tool { color: #f0f0f0; }
  .cc-tool::before { content: '● '; }
  .cc-sub { color: #5f5f5f; padding-left: 22px; }
  .cc-sub::before { content: '⎿  '; }
  .cc-resp { color: #f0f0f0; }
  .cc-resp::before { content: '✻ '; }
  .cc-spin { color: #5f5f5f; }
  .cc-foot {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px 14px; border-top: 1px solid #191919;
  }
  .cc-prompt-char { color: #5f5f5f; font-size: 11px; letter-spacing: 0.08em; flex: none; }
  .cc-input {
    flex: 1; background: transparent; border: none; outline: none;
    font: inherit; font-size: 11px; letter-spacing: 0.04em;
    color: #f0f0f0; caret-color: #f0f0f0;
  }
  .cc-input::placeholder { color: #3a3a3a; }
  .cc-hint { color: #3a3a3a; font-size: 11px; letter-spacing: 0.08em; flex: none; }
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="stage">
  <div class="sb-title">SUPERBOT</div>
  <div class="sb-tag">SHEEN ON · RING 1px · 3s LINEAR</div>

  <!-- the button, unedited, from superbot-cursor-button lib/inject.js -->
  <div id="button-slot"></div>

  <div class="sb-input-wrap" id="input-wrap">
    <input class="sb-input" id="demo-input" type="text" spellcheck="false"
           placeholder="type into the sheen" aria-label="Superbot textbox">
    <i class="sb-led" aria-hidden="true"></i>
  </div>

  <div class="sb-caption">↳ enter does nothing here. the panel below answers.</div>

  <div class="sb-panel">
    <div class="cc-head">
      <span>✻ SUPERBOT CODE <span class="cc-dim">v2.1.257</span></span>
      <span id="panel-pill-slot"></span>
    </div>
    <div class="cc-body" id="cc-body"></div>
    <div class="cc-foot">
      <span class="cc-prompt-char">&gt;</span>
      <input class="cc-input" id="cc-input" type="text" spellcheck="false"
             placeholder="ask superbot anything… (/ for commands)" aria-label="Superbot Code prompt">
      <span class="cc-hint">esc to interrupt</span>
    </div>
  </div>

  <div class="sb-caption">SUPERBOT LAB · STARS 130 · GLYPHS * + · ✦ ˚ ×</div>
</div>

<script>
  // ---------------- starfield: little ASCII stars fading in and out ----------------
  (function () {
    "use strict";
    var canvas = document.getElementById("stars");
    var ctx = canvas.getContext("2d");
    var dpr = 1;
    function resize() {
      dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(innerWidth * dpr);
      canvas.height = Math.floor(innerHeight * dpr);
    }
    window.addEventListener("resize", resize);
    resize();
    var GLYPHS = ["*", "+", "·", "✦", "˚", "×"];
    var stars = [];
    for (var i = 0; i < 130; i++) {
      stars.push({
        x: Math.random(), y: Math.random(),
        g: GLYPHS[(Math.random() * GLYPHS.length) | 0],
        s: 8 + Math.random() * 8,
        ph: Math.random() * Math.PI * 2,
        sp: 0.15 + Math.random() * 0.7,
        a: 0.10 + Math.random() * 0.5
      });
    }
    function tick(t) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      var time = t / 1000;
      ctx.fillStyle = "#f0f0f0";
      for (var i = 0; i < stars.length; i++) {
        var st = stars[i];
        var o = st.a * (0.5 + 0.5 * Math.sin(time * st.sp + st.ph));
        if (o < 0.02) continue;
        ctx.globalAlpha = o;
        ctx.font = (st.s * dpr) + "px ui-monospace, 'SF Mono', Menlo, monospace";
        ctx.fillText(st.g, st.x * canvas.width, st.y * canvas.height);
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();

  // ---------------- the button, VERBATIM from superbot-cursor-button lib/inject.js ----------------
  // (makeButton, lines 141-167; toolbar height/padding from placeNextTo, lines 199-200)
  (function () {
    "use strict";
    var BUTTON_LABEL = "SUPERBOT";
    var MARKER = "data-superbot";
    var sheenOff = false;
    function makeButton() {
      var btn = document.createElement("button");
      btn.className = "superbot-btn";
      btn.type = "button";
      btn.title = "SUPERBOT — click to toggle the sheen";
      btn.setAttribute("aria-label", "Superbot");
      btn.setAttribute("aria-pressed", sheenOff ? "false" : "true");
      btn.setAttribute(MARKER, "1");
      btn.textContent = BUTTON_LABEL;
      if (sheenOff) btn.classList.add("is-off");
      // state LED: lit while the sheen is ON, dark when toggled OFF
      var led = document.createElement("i");
      led.className = "sb-led";
      btn.appendChild(led);
      btn.addEventListener("click", function (ev) {
        ev.stopPropagation();
        ev.preventDefault();
        // ON / OFF: pressing toggles the sheen animation for this pill.
        sheenOff = !sheenOff;
        btn.classList.toggle("is-off", sheenOff);
        btn.setAttribute("aria-pressed", sheenOff ? "false" : "true");
        btn.title = sheenOff
          ? "SUPERBOT — sheen OFF, click to enable"
          : "SUPERBOT — click to toggle the sheen";
      });
      return btn;
    }
    var b = makeButton();
    b.style.height = "30px";
    b.style.padding = "0 16px";
    document.getElementById("button-slot").appendChild(b);

    var p = makeButton();
    p.style.height = "22px";
    p.style.padding = "0 12px";
    p.style.fontSize = "10px";
    p.style.marginLeft = "0";
    document.getElementById("panel-pill-slot").appendChild(p);

    // CSS for the button itself, VERBATIM from lib/inject.js (lines 34-69),
    // minus margin-left (a toolbar-placing property, no toolbar here).
    var style = document.createElement("style");
    style.id = "superbot-cursor-button-style";
    style.textContent = [
      ".superbot-btn {",
      "  position: relative; display: inline-flex; align-items: center; justify-content: center;",
      "  padding: 0 16px;",
      "  border-radius: 999px; border: none; cursor: pointer; vertical-align: middle;",
      "  overflow: visible; isolation: isolate;",
      "  background: #050505; color: #f0f0f0;",
      "  font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;",
      "  font-size: 11px; font-weight: 700; letter-spacing: 0.08em;",
      "  transition: color 0.25s ease, transform 0.15s ease;",
      "}",
      ".superbot-btn::before {",
      "  content: ''; position: absolute; inset: -1px; border-radius: 999px; padding: 1px;",
      "  background: conic-gradient(from var(--superbot-angle), #2a2a2a 0deg, #eeeeee 40deg, #2a2a2a 120deg, #2a2a2a 360deg);",
      "  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);",
      "  -webkit-mask-composite: xor; mask-composite: exclude;",
      "  animation: superbot-spin 3s linear infinite; pointer-events: none; z-index: 1;",
      "  transition: filter 0.3s ease;",
      "}",
      ".superbot-btn:hover { color: #fff; }",
      ".superbot-btn:hover::before { filter: brightness(1.9); }",
      ".superbot-btn:active { transform: scale(0.97); }",
      ".superbot-btn .sb-led {",
      "  display: inline-block; width: 4px; height: 4px; margin-left: 7px;",
      "  border-radius: 50%; background: #f0f0f0; vertical-align: middle;",
      "  box-shadow: 0 0 4px rgba(255,255,255,0.7);",
      "  transition: background 0.25s ease, box-shadow 0.25s ease;",
      "}",
      ".superbot-btn.is-off { color: #5f5f5f; }",
      ".superbot-btn.is-off::before {",
      "  animation-play-state: paused; background: #191919; filter: none;",
      "}",
      ".superbot-btn.is-off .sb-led { background: #3a3a3a; box-shadow: none; }"
    ].join("\n");
    document.head.appendChild(style);
  })();

  // ---------------- textbox LED: lit when the input holds text ----------------
  (function () {
    "use strict";
    var wrap = document.getElementById("input-wrap");
    var input = document.getElementById("demo-input");
    function sync() {
      wrap.classList.toggle("has-text", input.value.length > 0);
    }
    input.addEventListener("input", sync);
    sync();
  })();

  // ---------------- claude code panel: fake session ----------------
  (function () {
    "use strict";
    var body = document.getElementById("cc-body");
    var input = document.getElementById("cc-input");
    var SPIN = ["✻", "✽", "✶", "·", "✳"];

    function line(cls, text) {
      var el = document.createElement("div");
      el.className = "cc-line " + cls;
      el.textContent = text;
      body.appendChild(el);
      body.scrollTop = body.scrollHeight;
      return el;
    }

    var RESPONSES = [
      [
        ["cc-tool", "Read(lib/inject.js)"],
        ["cc-sub", "Read 301 lines"],
        ["cc-resp", "The ring is a 1px conic-gradient, masked with xor. It spins at 3s per turn. That is the whole trick."]
      ],
      [
        ["cc-tool", "Grep(--superbot-angle)"],
        ["cc-sub", "Found 4 matches across 2 files"],
        ["cc-resp", "The angle is a registered @property, which is why the ring interpolates instead of jumping. Unregistered custom properties do not animate."]
      ],
      [
        ["cc-tool", "Read(index.html)"],
        ["cc-sub", "Read " + (document.body.children.length + 47) + " lines"],
        ["cc-resp", "Stars are glyphs on a canvas, each on its own sine. No sprites, no WebGL — 130 fillText calls a frame."]
      ],
      [
        ["cc-tool", "Edit(style.css)"],
        ["cc-sub", "Updated 1 line"],
        ["cc-resp", "Sheen toggled. Everything here is #050505 under a light you can switch off."]
      ]
    ];
    var next = 0;

    function spinner() {
      var el = line("cc-spin", "Thinking… (esc to interrupt)");
      var i = 0;
      var t = setInterval(function () {
        el.textContent = SPIN[i++ % SPIN.length] + " Thinking… (esc to interrupt)";
      }, 90);
      return function done() {
        clearInterval(t);
        el.remove();
      };
    }

    function canned(delay) {
      var stop = spinner();
      setTimeout(function () {
        stop();
        var resp = RESPONSES[next++ % RESPONSES.length];
        for (var i = 0; i < resp.length; i++) line(resp[i][0], resp[i][1]);
      }, delay);
    }

    function boot() {
      line("cc-line", "✻ Welcome to SUPERBOT CODE!");
      line("cc-sub", "/help for help  ·  shift+tab to auto-accept edits  ·  nothing here is real");
    }
    boot();

    input.addEventListener("keydown", function (ev) {
      if (ev.key !== "Enter" || !input.value.trim()) return;
      ev.preventDefault();
      var text = input.value.trim();
      input.value = "";
      if (text === "/help") {
        line("cc-sub", "commands: /help, /sheen, /clear — everything else gets a hallucination");
        return;
      }
      if (text === "/clear") {
        body.textContent = "";
        boot();
        return;
      }
      if (text === "/sheen") {
        var pill = document.querySelector("#panel-pill-slot .superbot-btn");
        if (pill) pill.click();
        line("cc-sub", "toggled the panel pill's sheen for you");
        return;
      }
      line("cc-user", text);
      canned(900 + Math.random() * 900);
    });
  })();
</script>
</body>
</html>

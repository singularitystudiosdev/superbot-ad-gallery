<script>
// The aspect-ratio stage (the gallery's assets/ar.js, cut down): ?ar= picks 16x9 / 4x3 / 1x1 / 4x5, otherwise the ratio
// nearest the window. Height is always 1080 stage px; the width follows the ratio. Mirrored onto <html> as data-ar.
(function () {
  var RATIOS = { '16x9': [16, 9], '4x3': [4, 3], '1x1': [1, 1], '4x5': [4, 5] };
  var q = (new URLSearchParams(location.search).get('ar') || '').replace(':', 'x').replace('-', 'x');
  var locked = RATIOS[q] ? q : null;
  function nearest() {
    var f = innerWidth / Math.max(1, innerHeight), best = '16x9', d = Infinity;
    for (var k in RATIOS) { var dd = Math.abs(Math.log(f / (RATIOS[k][0] / RATIOS[k][1]))); if (dd < d) { d = dd; best = k; } }
    return best;
  }
  function apply(key) {
    var prev = window.AR && window.AR.key;
    window.AR = { key: key, w: Math.round(1080 * RATIOS[key][0] / RATIOS[key][1]), h: 1080 };
    document.documentElement.dataset.ar = key;
    if (prev && prev !== key) dispatchEvent(new CustomEvent('archange', { detail: window.AR }));
  }
  apply(locked || nearest());
  if (!locked) addEventListener('resize', function () { apply(nearest()); });
})();
</script>
<style>
/* the multicat-localhost.516afb1a spot's tokens: its end card black, chip greys, storm mark colours and type */
:root {
  --bg: #0a0a0b; --chip: #1c1c20; --chip-line: #2a2a2e; --tile: #131316; --tile-line: #34343a;
  --fg: #ffffff; --fg-2: #e6e8ee; --muted: #a1a1a6; --danger: #ef4444;
  --storm-0: #00e5c3; --storm-1: #2b6bff; --storm-2: #6a1fd8; --storm-3: #c026d3; --storm-4: #ff3d9a;
  --storm-x: linear-gradient(90deg, var(--storm-0) 0%, var(--storm-1) 30%, var(--storm-2) 55%, var(--storm-3) 80%, var(--storm-4) 100%);
  --ui: "SF Pro Rounded", "SF Pro Display", -apple-system, system-ui, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body { font-family: var(--ui); color: var(--fg); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 50% 50%; background: var(--bg); overflow: hidden; }

/* a beat: a full-stage layer, centred; .fit is scaled down (--s) only when the ratio is too narrow for it */
.beat { position: absolute; inset: 0; display: block; opacity: 0; visibility: hidden; }
.beat.on { visibility: visible; }
.fit { position: absolute; left: 50%; top: 50%; display: flex; flex-direction: column; align-items: center; width: max-content;
  transform: translate(-50%, -50%) scale(var(--s, 1)); }
.w { display: inline-block; will-change: transform, opacity, filter; }

/* B1: DEAR API USERS under a code glyph on a dark tile (the house icon set's `code`, shell.9b47fc30.js ICON.code); no
   vendor is named or shown anywhere in the spot */
.tile { display: grid; place-items: center; width: 200px; height: 200px; border-radius: 46px; background: var(--tile);
  box-shadow: inset 0 0 0 2px var(--tile-line), 0 24px 60px rgb(0 0 0 / .5); will-change: transform, opacity; }
.glyph { display: block; fill: none; stroke: var(--fg); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tile .glyph { width: 52%; height: 52%; }
.dear { margin: 56px 0 0; font-size: 150px; font-weight: 800; letter-spacing: -.03em; line-height: 1; white-space: nowrap; display: flex; gap: .26em; }

/* B2/B3: the chip that swaps Before for After, the price, the meter */
.chips { position: relative; width: 760px; height: 120px; }
.chip { position: absolute; left: 50%; top: 0; display: inline-flex; align-items: center; gap: 22px; height: 120px; padding: 0 44px 0 18px;
  border-radius: 999px; background: var(--chip); box-shadow: 0 0 0 2px var(--chip-line); white-space: nowrap;
  font-size: 58px; font-weight: 700; letter-spacing: -.02em; color: var(--fg-2); transform: translateX(-50%); will-change: transform, opacity, filter; }
.chip .ico { display: grid; place-items: center; width: 84px; height: 84px; border-radius: 22px; background: var(--tile); box-shadow: inset 0 0 0 2px var(--tile-line); }
.chip .ico .glyph { width: 56%; height: 56%; }
.chip .ico svg { width: 74%; height: 74%; overflow: visible; }
.chip-after { color: var(--fg); }
.amount { position: relative; margin-top: 54px; display: flex; align-items: baseline; justify-content: center; white-space: nowrap; font-weight: 800; letter-spacing: -.035em; line-height: 1; }
.num { font-size: 300px; font-variant-numeric: tabular-nums; }
.per { margin-left: 10px; font-size: 120px; color: var(--muted); letter-spacing: -.02em; }
.meter { position: relative; width: 1180px; height: 26px; margin-top: 64px; border-radius: 999px; background: var(--chip); box-shadow: inset 0 0 0 2px var(--chip-line); }
.fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; }
.fill.red { background: linear-gradient(90deg, #f97316, var(--danger)); box-shadow: 0 0 28px rgb(239 68 68 / .45); }
.fill.storm { background: var(--storm-x); box-shadow: 0 0 28px rgb(0 229 195 / .5); }
.less { margin-top: 40px; padding: 14px 30px; border-radius: 999px; white-space: nowrap;
  background: rgb(0 229 195 / .12); box-shadow: inset 0 0 0 2px rgb(0 229 195 / .45); color: var(--storm-0); font-size: 50px; font-weight: 800; letter-spacing: -.02em; opacity: 0; }

/* B4: One download and stop paying API pricing, API pricing struck */
.line { margin: 0; font-size: 150px; font-weight: 800; letter-spacing: -.03em; line-height: 1.04; text-align: center; white-space: nowrap; }
.line .ln { display: flex; justify-content: center; gap: .26em; }
.line .g { background: var(--storm-x); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: .06em; }
.strike { position: relative; display: inline-flex; gap: .26em; }
.strike .bar { position: absolute; left: -.06em; right: -.06em; top: 50%; height: 16px; margin-top: -4px; border-radius: 8px; background: var(--danger);
  transform: scaleX(0); transform-origin: 0 50%; box-shadow: 0 0 24px rgb(239 68 68 / .55); }

/* B5: the house superbot.gg lockup, wordmark left and mascot right (column on the narrow ratios); the whole stage links out */
.end { text-decoration: none; color: var(--fg); pointer-events: none; }
.end.live { pointer-events: auto; cursor: pointer; }
.lock { display: flex; align-items: center; gap: 44px; }
.end-word { font-size: 128px; font-weight: 800; letter-spacing: -.03em; line-height: 1; white-space: nowrap; will-change: transform, opacity, filter; }
.end-bot { width: 220px; height: 220px; will-change: transform, opacity; }
.end-bot svg { display: block; width: 100%; height: 100%; overflow: visible; }
html[data-ar="1x1"] .lock, html[data-ar="4x5"] .lock { flex-direction: column-reverse; gap: 28px; }

/* the narrow ratios: DEAR / API / USERS stacked; the price beat is fitted by its number, so its chip, meter and badge
   are drawn larger here to land at a readable size once .fit scales the beat down */
html[data-ar="1x1"] .dear, html[data-ar="4x5"] .dear { flex-direction: column; align-items: center; gap: 0; font-size: 170px; line-height: 1.02; }
html[data-ar="1x1"] .chips, html[data-ar="4x5"] .chips { width: 1100px; height: 170px; }
html[data-ar="1x1"] .chip, html[data-ar="4x5"] .chip { height: 170px; gap: 30px; padding: 0 64px 0 26px; font-size: 86px; }
html[data-ar="1x1"] .chip .ico, html[data-ar="4x5"] .chip .ico { width: 122px; height: 122px; border-radius: 32px; }
html[data-ar="1x1"] .meter, html[data-ar="4x5"] .meter { width: 1460px; height: 40px; margin-top: 80px; }
html[data-ar="1x1"] .less, html[data-ar="4x5"] .less { margin-top: 60px; padding: 20px 46px; font-size: 80px; }

/* chrome outside the stage, hidden on a frozen capture */
.hint { position: fixed; right: 18px; bottom: 14px; font: 11px/1 var(--ui); color: var(--muted); opacity: .6; user-select: none; }
.ctrls { position: fixed; left: 18px; bottom: 10px; display: flex; gap: 8px; }
.ctrls button { min-height: 24px; padding: 4px 10px; font: 500 11px/1.4 var(--ui); color: #aeb1bc;
  background: rgb(255 255 255 / .06); border: 1px solid rgb(255 255 255 / .12); border-radius: 999px; opacity: .7; cursor: pointer; }
.ctrls button:hover { opacity: 1; color: #fff; }
.ctrls button:focus-visible { outline: 2px solid var(--storm-1); outline-offset: 2px; }
.ctrls .sound[aria-pressed="true"] { color: #fff; border-color: rgb(0 229 195 / .6); }
body.freeze .hint, body.freeze .ctrls { display: none; }
</style>

<div id="stage">
  <section class="beat" id="b-dear" aria-label="Dear API users">
    <div class="fit">
      <div class="tile"><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg></div>
      <h1 class="dear"><span class="w">DEAR</span><span class="w">API</span><span class="w">USERS</span></h1>
    </div>

  <section class="beat" id="b-cost" aria-label="Before superbot $30,000 a month, after superbot $800 a month">
    <div class="fit">
      <div class="chips">
        <div class="chip chip-before"><span class="ico"><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg></span>Before superbot</div>

        <span class="ln"><span class="w g">One download</span></span>
        <span class="ln"><span class="w">and</span><span class="w">stop</span><span class="w">paying</span></span>

      </h2>

  <a class="beat end" id="b-end" href="https://superbot.gg" target="_blank" rel="noopener" aria-label="superbot.gg">

<div class="ctrls">

</div>

<script>
// "DEAR API USERS" (the API-users cut of the f187dd19 spot): the spot is a pure function of t like the reference (multicat-localhost.516afb1a/timeline.9b47fc30.js):
// ?t=<s> freezes a frame, ?t=<s>&play=1 plays on from there, space pauses, arrows step 0.25s, R restarts; a 60fps quantised
// clock. It plays once and holds the end card; space after the end replays it.
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const inOutCubic = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const outBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

// the house mascot face (END_FACE in multicat.516afb1a.js): cyan and magenta glitch layers under the white mark
const face = (id) => `<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><defs><mask id="${id}" maskUnits="userSpaceOnUse" x="-30" y="-30" width="160" height="160"><g fill="#fff"><rect x="14" y="32" width="72" height="54" rx="15"/><path d="M14 46V28Q14 20 21 21Q28 24 36 32Z"/><path d="M86 46V28Q86 20 79 21Q72 24 64 32Z"/></g><g fill="#000"><ellipse cx="35" cy="58" rx="8" ry="11"/><ellipse cx="65" cy="58" rx="8" ry="11"/></g></mask></defs><rect x="-30" y="-30" width="160" height="160" fill="#00e5c3" mask="url(#${id})" transform="translate(-1.2 -1.2)"/><rect x="-30" y="-30" width="160" height="160" fill="#c026d3" mask="url(#${id})" transform="translate(1.2 1.2)"/><rect x="-30" y="-30" width="160" height="160" fill="#fff" mask="url(#${id})"/></svg>`;
document.querySelectorAll('[data-face]').forEach((el) => { el.innerHTML = face('sbFace-' + el.dataset.face); });

// the beats, in seconds
const B = {
  dearIn: 0.15, dearOut: 2.45,
  costIn: 2.38, countA: 2.7, countB: 4.1, swap: 5.2, rollA: 5.4, rollB: 6.3, less: 6.4, costOut: 7.7,
  lineIn: 7.6, strike: 9.3, lineOut: 10.3,
  endIn: 10.22,
};
const CYCLE = 13;
const BEFORE = 30000, AFTER = 800;
const OUT = 0.3; // every beat's exit: fade, lift and blur

const $ = (s, r = document) => r.querySelector(s);
const stage = $('#stage');
const dear = $('#b-dear'), cost = $('#b-cost'), line = $('#b-line'), end = $('#b-end');
const tile = $('.tile', dear), dearWords = [...dear.querySelectorAll('.w')];
const chipBefore = $('.chip-before'), chipAfter = $('.chip-after'), num = $('.num'), fillRed = $('.fill.red'), fillStorm = $('.fill.storm'), less = $('.less');
const lineWords = [...line.querySelectorAll('.w')], strikeBar = $('.strike .bar'), struck = [...line.querySelectorAll('.strike .w')];
const endWord = $('.end-word'), endBot = $('.end-bot');

const H = 1080;
const W = () => (window.AR && window.AR.w) || 1920;

// a word rising into place: up 60px, blurred, transparent at a; settled by a + 0.45
function rise(el, t, a, dy = 60) {
  const p = seg(t, a, a + 0.45), e = outCubic(p);
  el.style.opacity = seg(t, a, a + 0.25).toFixed(3);
  el.style.transform = `translateY(${((1 - e) * dy).toFixed(1)}px)`;
  el.style.filter = p < 1 ? `blur(${((1 - e) * 14).toFixed(1)}px)` : 'none';
}
// a beat's layer: shown from a, gone after b (its exit takes OUT seconds and lifts and blurs it)
function layer(el, t, a, b, fadeIn = 0) {
  const o = (fadeIn ? seg(t, a, a + fadeIn) : (t >= a ? 1 : 0)) * (1 - seg(t, b - OUT, b));
  const x = seg(t, b - OUT, b);
  el.style.opacity = o.toFixed(3);
  el.classList.toggle('on', o > 0);
  el.style.transform = x > 0 ? `translateY(${(-x * 40).toFixed(1)}px)` : '';
  el.style.filter = x > 0 ? `blur(${(x * 16).toFixed(1)}px)` : 'none';
  return o > 0;
}
const money = (v) => '$' + Math.round(v).toLocaleString('en-US');

// the price at t: counts up to $30,000, holds, rolls down to $800
function price(t) {
  if (t < B.countA) return 0;
  if (t < B.countB) return BEFORE * outCubic(seg(t, B.countA, B.countB));
  if (t < B.rollA) return BEFORE;
  return lerp(BEFORE, AFTER, inOutCubic(seg(t, B.rollA, B.rollB)));
}

function render(t) {
  // B1: the code tile pops, then DEAR API USERS rises word by word
  if (layer(dear, t, 0, B.dearOut)) {
    const p = seg(t, B.dearIn, B.dearIn + 0.55);
    tile.style.opacity = seg(t, B.dearIn, B.dearIn + 0.25).toFixed(3);
    tile.style.transform = `scale(${(0.5 + 0.5 * outBack(p)).toFixed(3)}) rotate(${((1 - outCubic(p)) * -10).toFixed(2)}deg)`;
    dearWords.forEach((w, i) => rise(w, t, B.dearIn + 0.4 + i * 0.14));
  }

  // B2 + B3: Before superbot counts up to $30,000/mo; the chip flips to After superbot and the price rolls down to $800/mo
  if (layer(cost, t, B.costIn, B.costOut, 0.4)) {
    const inP = outCubic(seg(t, B.costIn, B.costIn + 0.5));
    const v = price(t);
    num.textContent = money(v);
    fillRed.style.width = fillStorm.style.width = (v / BEFORE * 100).toFixed(2) + '%';
    const toStorm = seg(t, B.rollA, B.rollA + 0.5);
    fillRed.style.opacity = (1 - toStorm).toFixed(3);
    fillStorm.style.opacity = toStorm.toFixed(3);
    // the Before chip settles in with the layer, then leaves upward as the After chip comes up from below
    const off = seg(t, B.swap, B.swap + 0.35), on = outCubic(seg(t, B.swap + 0.08, B.swap + 0.5));
    chipBefore.style.opacity = (inP * (1 - off)).toFixed(3);
    chipBefore.style.transform = `translateX(-50%) translateY(${((1 - inP) * 40 - outCubic(off) * 90).toFixed(1)}px)`;
    chipBefore.style.filter = off > 0 ? `blur(${(off * 14).toFixed(1)}px)` : 'none';
    chipAfter.style.opacity = on.toFixed(3);
    chipAfter.style.transform = `translateX(-50%) translateY(${((1 - on) * 90).toFixed(1)}px)`;
    chipAfter.style.filter = on < 1 ? `blur(${((1 - on) * 14).toFixed(1)}px)` : 'none';
    // 97% less pops under the meter once the price lands
    const lp = seg(t, B.less, B.less + 0.4);
    less.style.opacity = seg(t, B.less, B.less + 0.2).toFixed(3);
    less.style.transform = `scale(${(0.6 + 0.4 * outBack(lp)).toFixed(3)})`;
    // a slow push-in over the whole beat
    cost.firstElementChild.style.transform = `translate(-50%, -50%) scale(calc(var(--s, 1) * ${(0.96 + 0.04 * inP + 0.03 * seg(t, B.costIn, B.costOut)).toFixed(4)}))`;
  }

  // B4: One download / and stop paying / API pricing, then API pricing is struck
  if (layer(line, t, B.lineIn, B.lineOut)) {
    lineWords.forEach((w, i) => rise(w, t, B.lineIn + 0.05 + i * 0.1));
    const sp = outCubic(seg(t, B.strike, B.strike + 0.3));
    strikeBar.style.transform = `scaleX(${sp.toFixed(3)})`;
    struck.forEach((w) => { w.style.opacity = (Math.min(Number(w.style.opacity || 1), 1) * (1 - 0.5 * sp)).toFixed(3); });
  }

  // B5: superbot.gg, the mascot popping in beside it; held, and the whole stage links to superbot.gg
  const shown = layer(end, t, B.endIn, CYCLE + 1, 0.25);
  end.classList.toggle('live', t >= B.endIn + 0.4);
  if (shown) {
    const wp = seg(t, B.endIn + 0.1, B.endIn + 0.6);
    endWord.style.opacity = seg(t, B.endIn + 0.1, B.endIn + 0.4).toFixed(3);
    endWord.style.transform = `translateY(${((1 - outCubic(wp)) * 40).toFixed(1)}px)`;
    endWord.style.filter = wp < 1 ? `blur(${((1 - outCubic(wp)) * 14).toFixed(1)}px)` : 'none';
    const bp = seg(t, B.endIn + 0.3, B.endIn + 0.85);
    const bob = Math.sin((t - B.endIn - 0.85) * 2.4) * 6 * seg(t, B.endIn + 0.85, B.endIn + 1.4);
    endBot.style.opacity = seg(t, B.endIn + 0.3, B.endIn + 0.5).toFixed(3);
    endBot.style.transform = `translateY(${bob.toFixed(1)}px) scale(${(0.3 + 0.7 * outBack(bp)).toFixed(3)}) rotate(${((1 - outCubic(bp)) * -12).toFixed(2)}deg)`;
  }
}

// ---------- fit: the stage to the window, and each beat to a narrow stage ----------
function fit() {
  const w = W();
  stage.style.width = w + 'px';
  stage.style.height = H + 'px';
  const k = Math.min(innerWidth / w, innerHeight / H);
  stage.style.transform = `translate(-50%, -50%) scale(${k})`;
  for (const f of stage.querySelectorAll('.fit')) {
    const s = Math.min(1, (w - 140) / f.offsetWidth, (H - 140) / f.offsetHeight);
    f.style.setProperty('--s', s.toFixed(4));
  }
}
// the widest the price ever gets, so the cost beat's fit is measured at $30,000 rather than $0
num.textContent = money(BEFORE);
fit();
addEventListener('resize', fit);
addEventListener('archange', () => { fit(); render(timeNow()); });
document.fonts && document.fonts.ready.then(() => { num.textContent = money(BEFORE); fit(); render(timeNow()); });

// ---------- the clock ----------
const q = new URLSearchParams(location.search);
const hasT = q.has('t'), freeze = hasT && !q.has('play');
if (freeze) document.body.classList.add('freeze');
const FPS = 60;
let paused = freeze, base = hasT ? parseFloat(q.get('t')) || 0 : 0, started = performance.now();
const now = () => (paused ? base : base + (performance.now() - started) / 1000);
const timeNow = () => Math.min(Math.round(clamp(now(), 0, CYCLE) * FPS) / FPS, CYCLE);
const ended = () => base >= CYCLE;
const restart = () => { base = 0; started = performance.now(); paused = false; };

// ---------- sound: the soundtrack, cut to the spot (track time = ad time) ----------
// assets/dear-api-users.c060dffc.m4a is a music bed whose drop lands on the chip swap plus one effect per beat of B.
// It plays when the browser allows it (the gallery lightbox delegates autoplay); otherwise the first click or key, or
// the lightbox's { type: 'unmute' } message, turns it on, replaying the spot if it has already ended. Web Audio, not
// <audio>: each run of the clock starts one buffer source at the clock's offset (ahead by the output latency) and never
// re-seeks it, so it cannot skip; pausing, stepping or seeking the clock (space, arrows, ?t=, seek()) stops it.
const actx = new AudioContext();
let buffer = null, source = null, sourceRun = -1, soundOn = false;
fetch('assets/dear-api-users.c060dffc.m4a')
  .then((r) => { if (!r.ok) throw new Error(`sound: HTTP ${r.status}`); return r.arrayBuffer(); })
  .then((bytes) => actx.decodeAudioData(bytes))
  .then((decoded) => { buffer = decoded; })
  .catch((err) => console.error('sound: the track failed to load', err));
const soundBtn = $('.sound');
function stopSource() {
  if (source) { source.stop(); source.disconnect(); source = null; }
  sourceRun = -1;
}
function setSound(on, replay = true) {
  soundOn = on;
  soundBtn.setAttribute('aria-pressed', String(on));
  soundBtn.textContent = on ? 'sound on' : 'sound off · click anywhere';
  if (!on) { stopSource(); return; }
  if (replay && ended()) restart();
  actx.resume().catch((err) => { console.error('sound: the audio context refused to start', err); setSound(false); });
}
function syncAudio() {
  if (!soundOn || paused || !buffer || actx.state !== 'running') { stopSource(); return; }
  if (sourceRun === started) return;
  stopSource();
  const at = now() + (actx.outputLatency || actx.baseLatency || 0);
  if (at >= buffer.duration) return;
  source = actx.createBufferSource();
  source.buffer = buffer;
  source.connect(actx.destination);
  source.start(0, at);
  sourceRun = started;
}
if (actx.state === 'running' && !freeze) setSound(true);
// a click on the live end card is a trip to superbot.gg, so it turns sound on without replaying under the link
addEventListener('pointerdown', (e) => { if (!soundOn && !freeze && !e.target.closest('.ctrls')) setSound(true, !e.target.closest('.end.live')); });
addEventListener('message', (e) => { if (e.data && e.data.type === 'unmute' && !soundOn && !freeze) setSound(true); });
soundBtn.addEventListener('click', () => setSound(!soundOn));
$('.replay').addEventListener('click', () => { setSound(true, false); restart(); });

addEventListener('keydown', (e) => {
  // a key turns sound on but leaves the clock to the key (space after the end replays by itself)
  if (!soundOn && !freeze && e.key !== 'm' && e.key !== 'M') setSound(true, false);
  if (e.key === ' ') {
    e.preventDefault();
    if (paused) { if (ended()) base = 0; paused = false; started = performance.now(); }
    else { base = now(); paused = true; }
  }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { base = clamp(timeNow() + (e.key === 'ArrowRight' ? 0.25 : -0.25), 0, CYCLE); paused = true; }
  else if (e.key === 'r' || e.key === 'R') restart();
  else if (e.key === 'm' || e.key === 'M') setSound(!soundOn);
});

function frame() {
  if (!paused && now() >= CYCLE) { base = CYCLE; paused = true; }
  render(timeNow());
  syncAudio();
  requestAnimationFrame(frame);
}
render(timeNow());
requestAnimationFrame(frame);

// frame-exact QA and offline renders: ready once the fonts are in (every mark is inline SVG)
window.__AD = {
  CYCLE,
  get ready() { return !document.fonts || document.fonts.status === 'loaded'; },
  seek(t) { paused = true; base = t; started = performance.now(); render(timeNow()); },
  play(t) { paused = false; base = t; started = performance.now(); render(timeNow()); },
  get now() { return timeNow(); },
  get playing() { return !paused; },
  // QA: where the sound is against the ad clock
  sound: () => ({ on: soundOn, playing: !!source, ctx: actx.state, loaded: !!buffer, t: timeNow() }),
};
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>superbot: dear cursor users</title>
<link rel="icon" href="data:,">
<script>
// The aspect-ratio stage of the gemini muse meme spots (assets/ar.js), inlined so the page is one file: ?ar= picks
// 16x9 / 4x3 / 1x1 / 4x5 (the gallery passes it), standalone it is the ratio nearest the window. The stage is always
// 1080 high and its width follows the ratio.
(function () {
  var RATIOS = { '16x9': [16, 9], '4x3': [4, 3], '1x1': [1, 1], '4x5': [4, 5] };
  var q = (new URLSearchParams(location.search).get('ar') || '').replace(':', 'x').replace('-', 'x');
  var locked = RATIOS[q] ? q : null;
  function nearest() {
    var f = innerWidth / Math.max(1, innerHeight), best = '16x9', d = Infinity;
    for (var k in RATIOS) {
      var dd = Math.abs(Math.log(f / (RATIOS[k][0] / RATIOS[k][1])));
      if (dd < d) { d = dd; best = k; }
    }
    return best;
  }
  function apply(key) {
    var r = RATIOS[key], prev = window.AR && window.AR.key;
    window.AR = { key: key, w: Math.round(1080 * r[0] / r[1]), h: 1080 };
    document.documentElement.dataset.ar = key;
    if (prev && prev !== key) dispatchEvent(new CustomEvent('archange'));
  }
  apply(locked || nearest());
  if (!locked) addEventListener('resize', function () { apply(nearest()); });
})();
</script>
<style>
/* White type on the spots' black (#0a0a0b, the house end card's), four lines one after another, then the multicat cut's
   ending: the house superbot.gg lockup, the wordmark left and the mascot face right. Sizes are on a 1080-high stage. */
html, body { margin: 0; height: 100%; background: #0a0a0b; overflow: hidden; }
body { -webkit-font-smoothing: antialiased; }
#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 50% 50%; background: #0a0a0b; overflow: hidden; }

.line {
  position: absolute; left: 50%; top: 50%; width: calc(var(--w) * 0.84); transform: translate(-50%, -50%);
  margin: 0; text-align: center; text-wrap: balance; color: #fff; visibility: hidden;
  font-family: "SF Pro Display", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  font-size: calc(var(--size) * var(--fs, 1)); font-weight: 700; letter-spacing: -0.03em; line-height: 1.1;
}
.line .w { display: inline-block; opacity: 0; will-change: transform, opacity, filter; }

.end-bot { position: absolute; left: 0; top: 0; width: calc(220px * var(--k, 1)); height: calc(220px * var(--k, 1)); opacity: 0; will-change: transform, opacity; }
.end-face { display: block; width: 100%; height: 100%; overflow: visible; }
.end-word { position: absolute; left: 0; top: 50%; opacity: 0; color: #fff; white-space: nowrap; font-family: "SF Pro Rounded", "SF Pro Display", -apple-system, system-ui, "Segoe UI", sans-serif; will-change: transform, opacity, filter; }
.end-word b { display: block; font-size: calc(128px * var(--k, 1)); font-weight: 800; letter-spacing: -0.03em; line-height: 1; }

.hint { position: fixed; right: 18px; bottom: 14px; font: 11px/1 -apple-system, system-ui, sans-serif; color: #8e8e93; opacity: .6; user-select: none; }
body.freeze .hint, body.framed .hint { display: none; }
</style>
</head>
<body>
<div id="stage" role="img" aria-label="dear cursor users. you are being upcharged and pay api pricing. superbot reroutes to subscription and removes the cursor upcharge. we did this to save people thousands. superbot.gg">
  <div class="end-word" id="endWord"><b>superbot.gg</b></div>
  <div class="end-bot" id="endBot"><svg class="end-face" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><defs><mask id="endFace" maskUnits="userSpaceOnUse" x="-30" y="-30" width="160" height="160"><g fill="#fff"><rect x="14" y="32" width="72" height="54" rx="15"/><path d="M14 46V28Q14 20 21 21Q28 24 36 32Z"/><path d="M86 46V28Q86 20 79 21Q72 24 64 32Z"/></g><g fill="#000"><ellipse cx="35" cy="58" rx="8" ry="11"/><ellipse cx="65" cy="58" rx="8" ry="11"/></g></mask></defs><rect x="-30" y="-30" width="160" height="160" fill="#00e5c3" mask="url(#endFace)" transform="translate(-1.2 -1.2)"/><rect x="-30" y="-30" width="160" height="160" fill="#c026d3" mask="url(#endFace)" transform="translate(1.2 1.2)"/><rect x="-30" y="-30" width="160" height="160" fill="#fff" mask="url(#endFace)"/></svg></div>
</div>
<div class="hint">space pause · ←/→ step · R restart</div>
<script>
// A pure function of t, like the gemini muse meme spots (timeline.9b47fc30.js): ?t=<s> freezes a frame, ?t=<s>&play=1
// plays on from there, space pauses, arrows step 0.25s, R restarts; a 60fps quantised clock. It plays once and holds
// its last frame. window.__AD = { CYCLE, ready, seek(t), play(t) } for frame-exact captures.
//
// Each line comes in word by word (blur to sharp, rising a little), holds long enough to read, and leaves softly. The
// ending is the multicat cut's (beats/multicat.516afb1a.js, from superbot-muse-split.1d16d488/endcard.1d16d488.html):
// the mascot pops in on the right of the centred lockup, superbot.gg fades up beside it, then it holds.
const LINES = [
  { text: 'dear cursor users', size: 132, in: 0.35, out: 2.55 },
  { text: 'you are being upcharged and pay api pricing', size: 100, in: 2.85, out: 6.15 },
  { text: 'superbot reroutes to subscription and removes the cursor upcharge', size: 100, in: 6.45, out: 10.25 },
  { text: 'we did this to save people thousands', size: 100, in: 10.55, out: 13.35 },
];
const WORD_GAP = 0.085, WORD_IN = 0.6, LINE_OUT = 0.4;
const END_AT = 13.75, END_LEN = 2.5, END_GAP = 44, END_HOLD = 0.9;
const CYCLE = END_AT + END_LEN + END_HOLD;
const H = 1080;

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const outQuint = (x) => 1 - Math.pow(1 - x, 5);
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
// the card's pop: an outBack with the house card's softer overshoot (1.4)
const popBack = (p) => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };

const stage = document.getElementById('stage');
const endWord = document.getElementById('endWord'), endBot = document.getElementById('endBot');
const lines = LINES.map((l) => {
  const el = document.createElement('p');
  el.className = 'line';
  el.style.setProperty('--size', l.size + 'px');
  el.innerHTML = l.text.split(' ').map((w) => `<span class="w">${w}</span>`).join(' ');
  stage.insertBefore(el, endWord);
  return { ...l, el, words: [...el.children] };
});

function renderLine(L, t) {
  const on = t >= L.in && t < L.out + LINE_OUT;
  L.el.style.visibility = on ? 'visible' : 'hidden';
  if (!on) return;
  const gone = outCubic(clamp((t - L.out) / LINE_OUT));
  L.el.style.opacity = (1 - gone).toFixed(3);
  L.el.style.filter = gone > 0 ? `blur(${(6 * gone).toFixed(2)}px)` : 'none';
  L.words.forEach((w, i) => {
    const p = clamp((t - L.in - i * WORD_GAP) / WORD_IN), e = outQuint(p);
    w.style.opacity = e.toFixed(3);
    w.style.filter = p < 1 ? `blur(${(8 * (1 - e)).toFixed(2)}px)` : 'none';
    w.style.transform = p < 1 ? `translateY(${(22 * (1 - e)).toFixed(2)}px)` : 'none';
  });
}

let endK = 1; // the lockup's scale now applied (--k)
function renderEnd(t) {
  const tc = t - END_AT;
  if (tc < 0) { endBot.style.opacity = '0'; endWord.style.opacity = '0'; return; }
  const W = stage.clientWidth;
  // the house sizes on a 1080-high stage, scaled down (--k) only when a narrow ratio would crop the lockup
  const natW = endWord.offsetWidth / endK;
  const k = Math.min(1, (W * 0.86) / (natW + END_GAP + 220));
  if (k !== endK) { stage.style.setProperty('--k', k.toFixed(4)); endK = k; }
  const w = 220 * k, wordW = natW * k, gap = END_GAP * k;
  const left = (W - (wordW + gap + w)) / 2, midY = H / 2;
  const pop = clamp(tc / 0.55), shift = outQuint(clamp((tc - 0.3) / 1.0));
  endBot.style.opacity = outQuint(clamp(tc / 0.3)).toFixed(3);
  endBot.style.transform = `translate(${(left + wordW + gap).toFixed(2)}px, ${(midY - w / 2).toFixed(2)}px) scale(${(0.72 + 0.28 * popBack(pop)).toFixed(4)})`;
  endWord.style.opacity = shift.toFixed(3);
  endWord.style.filter = shift < 1 ? `blur(${(6 * k * (1 - shift)).toFixed(2)}px)` : 'none';
  endWord.style.transform = `translate(${(left - 20 * k * (1 - shift)).toFixed(2)}px, -50%)`;
}

function render(t) {
  stage.style.opacity = clamp(t / 0.3).toFixed(3);
  for (const L of lines) renderLine(L, t);
  renderEnd(t);
}

// ---------- fit the stage to the window ----------
function fit() {
  const w = window.AR.w;
  stage.style.width = w + 'px';
  stage.style.height = H + 'px';
  stage.style.setProperty('--w', w + 'px');
  // narrower ratios set the lines a little smaller, so a long line wraps to four short ones at most
  stage.style.setProperty('--fs', (0.55 + 0.45 * w / 1920).toFixed(4));
  const k = Math.min(innerWidth / w, innerHeight / H);
  stage.style.transform = `translate(-50%, -50%) scale(${k})`;
}
addEventListener('resize', () => { fit(); render(timeNow()); });
addEventListener('archange', () => { fit(); render(timeNow()); });
fit();
if (window.self !== window.top) document.body.classList.add('framed');

// ---------- the clock ----------
const q = new URLSearchParams(location.search);
const hasT = q.has('t'), freeze = hasT && !q.has('play');
if (freeze) document.body.classList.add('freeze');
const FPS = 60;
let paused = freeze, base = hasT ? parseFloat(q.get('t')) || 0 : 0, started = performance.now();
const now = () => (paused ? base : base + (performance.now() - started) / 1000);
function timeNow() {
  const t = Math.min(Math.max(now(), 0), CYCLE);
  return Math.min(Math.round(t * FPS) / FPS, CYCLE);
}
const ended = () => base >= CYCLE;

addEventListener('keydown', (e) => {
  if (e.key === ' ') {
    e.preventDefault();
    if (paused) { if (ended()) base = 0; paused = false; started = performance.now(); }
    else { base = now(); paused = true; }
  }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { base = Math.min(CYCLE, Math.max(0, timeNow() + (e.key === 'ArrowRight' ? 0.25 : -0.25))); paused = true; }
  else if (e.key === 'r' || e.key === 'R') { base = 0; started = performance.now(); paused = false; }
});

// the clock starts once the type is in, so the first words never land in a fallback face
let ready = false;
function frame() {
  if (!paused && now() >= CYCLE) { base = CYCLE; paused = true; }
  render(timeNow());
  requestAnimationFrame(frame);
}
render(timeNow());
document.fonts.ready.then(() => {
  ready = true;
  if (!paused) started = performance.now();
  requestAnimationFrame(frame);
}, (err) => {
  console.error('dear-cursor-users: fonts failed to settle, playing anyway', err);
  ready = true;
  requestAnimationFrame(frame);
});

window.__AD = {
  CYCLE,
  get ready() { return ready; },
  seek(t) { paused = true; base = t; started = performance.now(); render(timeNow()); },
  play(t) { paused = false; base = t; started = performance.now(); render(timeNow()); },
  get now() { return timeNow(); },
  get playing() { return !paused; },
};
</script>
</body>
</html>

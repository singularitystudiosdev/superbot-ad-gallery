<script>
// The record-ready cut: opened straight on yt-thumbnail (and not ?controls=1, beats/ytthumb.c4e81a27.js CLEAN) the page
// is the app alone, and its one run must never be cut short: no key hint even while it loads, and neither guard below
// reloads it once it plays (a reload mid-run held its last frame on screen while the files came back)
var HOLD = /[?&]variant=yt-thumbnail(&|$)/.test(location.search) && !/[?&]controls=1(&|$)/.test(location.search);
if (HOLD) document.getElementById('hint').style.display = 'none';
// Boot guard. The spot is ~230 files, and an ES module graph runs only if every one of them downloads: when GitHub
// Pages refuses some of a cold load's requests (it does, for an address that loads the page over and over), nothing
// runs and the page stays black. A failed graph fires `error` on its module script, so bootFailed() reloads instead,
// waiting longer each time; the HTTP cache keeps every file that did arrive, so each try refetches only what failed.
// The count of tries clears once both entry modules have loaded. After the last try the page says so, with a Retry
// button: never a silent black page. On the record-ready cut (HOLD) only the spot's own graph (the timeline) counts:
// the controls' graph (pills, music, export) shows nothing there, so its failure is reported and the run goes on.
(function () {
  var KEY = 'boot-tries:' + location.pathname, WAIT = [1500, 4000, 10000], ENTRIES = 2, loaded = 0, failed = false;
  var spotLoaded = false, controlsFailed = false;
  window.bootSpotLoaded = function () {
    spotLoaded = true;
    if (controlsFailed) { sessionStorage.removeItem(KEY); return; }
    window.bootLoaded();
  };
  window.bootControlsFailed = function () {
    if (!HOLD) return window.bootFailed();
    controlsFailed = true;
    console.error(new Error('the spot\'s controls failed to download; the record-ready cut plays on without them'));
    if (spotLoaded) sessionStorage.removeItem(KEY);
  };
  function note(text, retry) {
    var el = document.getElementById('boot') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'boot', className: 'boot' }));
    el.textContent = text;
    if (retry) {
      var again = document.createElement('button');
      again.textContent = 'Retry';
      again.onclick = function () { location.reload(); };
      el.appendChild(again);
    }
  }
  window.bootLoaded = function () {
    if (++loaded === ENTRIES) sessionStorage.removeItem(KEY);
  };
  window.bootFailed = function () {
    if (failed) return;
    failed = true;
    var n = Number(sessionStorage.getItem(KEY) || 0);
    console.error(new Error('the spot\'s modules failed to download (try ' + (n + 1) + ' of ' + (WAIT.length + 1) + ')'));
    if (n < WAIT.length) {
      sessionStorage.setItem(KEY, String(n + 1));
      note('Loading…');
      setTimeout(function () { location.reload(); }, WAIT[n]);
    } else {
      sessionStorage.removeItem(KEY);
      note('The spot could not download all its files.', true);
    }
  };
})();
// Freshness. GitHub Pages lets a browser keep this page for 10 minutes (max-age=600) and the spot is republished every few
// minutes, so a tab, or the gallery's iframe, opened before a deploy keeps booting the old build: every module below is
// keyed off this page's ?v= stamps. Once the page has loaded, the copy it booted from (the HTTP cache's) is set beside the
// copy Pages serves now; if they differ, a newer build is out and the page reloads onto it, once per new build per tab, so
// a stale CDN edge can never make it loop. Never on a frozen capture (?t=), which must not move.
(function () {
  var url = location.href; // as loaded: the variant and ratio pickers rewrite the address later
  if (/[?&]t=/.test(location.search) || !window.fetch || !/^https?:$/.test(location.protocol) || HOLD) return;
  var text = function (r) { return r.ok ? r.text() : null; };
  addEventListener('load', function () {
    fetch(url, { cache: 'force-cache' }).then(text).then(function (booted) {
      return fetch(url, { cache: 'no-cache' }).then(text).then(function (now) {
        if (!booted || !now || booted === now) return;
        var key = 'fresh:' + location.pathname + ':' + now.length + ':' + now.slice(-400);
        if (sessionStorage.getItem(key)) return;
        sessionStorage.setItem(key, '1');
        location.reload();
      });
    }).catch(function () {});
  });
})();
</script>

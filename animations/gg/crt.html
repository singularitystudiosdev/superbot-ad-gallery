<script>
"use strict";

/* Textmode layers, one <pre> per plane — after ertdfgcvb's play.core buffer model. */

const RAW_MASK = `.................:*%@@@@@%+:..........................................:+%@@@@@@#-........ ..........
...............:#@@@@@@@@@@@%=......................................=%@@@@@@@@@@@%-.................

...... ...+@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@#............
..... ...:@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@=...........
.........*@@@@@@@@@@@@@@@@+.....-%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%...........
.... ....%@@@@@@@@@@@@@@#.... ....=@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@-..........
.... ...-@@@@@@@@@@@@@@@:..... ....+@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@+..........
........+@@@@@@@@@@@@@@@...........=@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@*..........
........+@@@@@@@@@@@@@@@-..........#@@@@@@@@@@@@@@@@@@@@@@*...............*@@@@@@@@@@@@@@*..........
........+@@@@@@@@@@@@@@@%-........#@@@@@@@@@@@@@@@@@@@@@@%.................%@@@@@@@@@@@@@*..........
........+@@@@@@@@@@@@@@@@@%+:.:-#@@@@@@@@@@@@@@@@@@@@@@@@@#:.............:#@@@@@@@@@@@@@@#..........
........+@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@*..........
........-@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@+..........
.........%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@#::-%@@@@@@@*::=@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@-..........
.........*@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%:....:+#%*=.....+@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@#...........
.........:%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@#..............-@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%:...........
..........-@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@*:.........=%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@=............
...........=@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@#***%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@=.............
............-%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@-..............
..............*@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@*................
...............:*@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@#:.................
..................=%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%=....................
.....................-*%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%#-.......................
..........................:-=*######################################*+-:............................`;

/* FIGlet "ANSI Shadow", rendered from patorjk/figlet.js fonts/ANSI Shadow.flf */
const RAW_LOGO = `███████╗██╗   ██╗██████╗ ███████╗██████╗ ██████╗  ██████╗ ████████╗    ██████╗  ██████╗
██╔════╝██║   ██║██╔══██╗██╔════╝██╔══██╗██╔══██╗██╔═══██╗╚══██╔══╝   ██╔════╝ ██╔════╝
███████╗██║   ██║██████╔╝█████╗  ██████╔╝██████╔╝██║   ██║   ██║      ██║  ███╗██║  ███╗
╚════██║██║   ██║██╔═══╝ ██╔══╝  ██╔══██╗██╔══██╗██║   ██║   ██║      ██║   ██║██║   ██║
███████║╚██████╔╝██║     ███████╗██║  ██║██████╔╝╚██████╔╝   ██║   ██╗╚██████╔╝╚██████╔╝
╚══════╝ ╚═════╝ ╚═╝     ╚══════╝╚═╝  ╚═╝╚═════╝  ╚═════╝    ╚═╝   ╚═╝ ╚═════╝  ╚═════╝`;

const MASK = (() => {
  const lines = RAW_MASK.split("\n").map(l => l.replace(/\./g, " "));
  let min = Infinity, max = 0;
  for (const l of lines) {
    if (!l.trim()) continue;
    min = Math.min(min, l.length - l.trimStart().length);
    max = Math.max(max, l.trimEnd().length);
  }
  return lines.map(l => l.slice(min, max).padEnd(max - min));
})();
const MW = MASK[0].length, MH = MASK.length;

const LOGO = RAW_LOGO.split("\n").map(l => l.trimEnd());
const LW = Math.max(...LOGO.map(l => l.length)), LH = LOGO.length;

const TAG   = "A U T O N O M O U S   G A M E   A G E N T S";
const BTNS  = ["[ ▸ DEPLOY A BOT ]", "[ ENTER THE ARENA ]"];
const STATS = "[ 12,408 BOTS ONLINE ]   [ 98.2% WIN RATE ]   [ 240 GAMES ]";

const RAMP1 = "  ..,:;=+*#";       // background field, sparse end first
const RAMP2 = "  .'-~:";           // second interference field
const DRAMP = ".,-~:;=!*#$@";      // a1k0n donut luminance ramp, verbatim

const TAU = Math.PI * 2;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

const $ = id => document.getElementById(id);
const stage = $("stage");
const L = { bg: $("bg"), bg2: $("bg2"), donut: $("donut"), scene: $("scene"), logo: $("logo"), hot: $("hot") };

let cols = 0, rows = 0, cw = 8, chh = 16, aspect = 0.5, fontSize = 14;
let G = [];                        // scene char grid, rows of arrays
let layout = null;                 // computed positions
let rects = [];                    // clickable regions
let hover = -1;
let donutOn = false, dw = 46, dh = 22, dz = [], db = [];
let fpsShown = 60, fpsEma = 60, fpsAt = 0;
let ptr = { col: 0, row: 0, sx: 0.5, sy: 0.5, stx: 0, sty: 0, in: false };
let glitchUntil = 0, glitchNext = 2600, glitchRows = [];

function metricsFor(size) {
  const probe = document.createElement("pre");
  probe.style.cssText = "position:absolute;left:-9999px;top:0;visibility:hidden";
  probe.style.fontSize = size + "px";
  probe.textContent = ("0".repeat(50) + "\n").repeat(10).trimEnd();
  document.body.appendChild(probe);
  const r = probe.getBoundingClientRect();
  document.body.removeChild(probe);
  return { cw: r.width / 50, ch: r.height / 10 };
}

function fit() {
  const W = innerWidth, H = innerHeight;
  const NEEDC = Math.max(LW, MW) + 6;
  const NEEDR = MH + LH + 12;
  const SIZES = [22, 20, 18, 16, 15, 14, 13, 12, 11, 10, 9, 8, 7, 6];
  let m = null;
  for (const s of SIZES) {
    const mm = metricsFor(s);
    fontSize = s; m = mm;
    if (Math.floor(W / mm.cw) >= NEEDC && Math.floor(H / mm.ch) >= NEEDR) break;
  }
  cw = m.cw; chh = m.ch; aspect = cw / chh;
  cols = Math.max(40, Math.floor(W / cw));
  rows = Math.max(24, Math.floor(H / chh));
  for (const k in L) L[k].style.fontSize = fontSize + "px";

  G = Array.from({ length: rows }, () => new Array(cols).fill(" "));

  const block = MH + 2 + LH + 1 + 1 + 2 + 1 + 2 + 1;
  const topY = 1 + Math.max(1, ((rows - 2 - block) / 2) | 0);
  layout = {
    topY,
    maskX: ((cols - MW) / 2) | 0,
    logoX: ((cols - LW) / 2) | 0,
    logoY: topY + MH + 2,
    tagY:  topY + MH + 2 + LH + 1,
    btnY:  topY + MH + 2 + LH + 1 + 2,
    statsY: topY + MH + 2 + LH + 1 + 2 + 2
  };

  dw = Math.min(46, (cols * 0.28) | 0);
  dh = Math.max(12, Math.round(dw * aspect) + 2);
  donutOn = cols >= 124 && rows >= 46;
  dz = new Array(dw * dh); db = new Array(dw * dh);
  L.donut.style.display = donutOn ? "block" : "none";

  L.logo.textContent = LOGO.join("\n");

  rects = [];
  const btnLine = BTNS.join("   ");
  let bx = ((cols - btnLine.length) / 2) | 0;
  rects.push({ x: bx, y: layout.btnY, label: BTNS[0] });
  rects.push({ x: bx + BTNS[0].length + 3, y: layout.btnY, label: BTNS[1] });
  rects.push({ x: cols - 14, y: 0, label: "[ CONNECT ]" });
}

/* Oldschool plasma, after play.core's plasma.js (bidouille.org primer):
   rotating directional sine + radial cosine around an orbiting center. */
const P = { sax: [], cax: [], say: [], cay: [], sbx: [], cbx: [], sby: [], cby: [], stx: [], sty: [], vx: [], vy: [] };

function buildBg(t) {
  const m = Math.min(cols, rows);
  const t1 = t * 0.50, t2 = t * 0.23;
  const dx = Math.sin(t1), dy = Math.cos(t1);
  const dx2 = Math.sin(-t1 * 0.62 + 1.7), dy2 = Math.cos(t1 * 0.47);
  const cx = Math.sin(-t1 * 0.9) * 0.75, cy = Math.cos(-t1 * 0.9) * 0.55;
  const cx2 = Math.sin(t2 * 1.3 + 3) * 0.8, cy2 = Math.cos(-t2 * 1.1) * 0.6;

  for (let x = 0; x < cols; x++) {
    const a = x * dx * 0.085, b = x * dx2 * 0.055;
    P.sax[x] = Math.sin(a); P.cax[x] = Math.cos(a);
    P.sbx[x] = Math.sin(b); P.cbx[x] = Math.cos(b);
    P.stx[x] = 2 * (x - cols / 2) / m * aspect;
    const nx = x / cols * 2 - 1; P.vx[x] = nx * nx;
  }
  for (let y = 0; y < rows; y++) {
    const a = y * dy * 0.085, b = y * dy2 * 0.055;
    P.say[y] = Math.sin(a); P.cay[y] = Math.cos(a);
    P.sby[y] = Math.sin(b); P.cby[y] = Math.cos(b);
    P.sty[y] = 2 * (y - rows / 2) / m;
    const ny = y / rows * 2 - 1; P.vy[y] = ny * ny;
  }

  const R1 = RAMP1.length, R2 = RAMP2.length;
  const outA = [], outB = [];
  for (let y = 0; y < rows; y++) {
    const sy1 = P.say[y], cy1 = P.cay[y], sy2 = P.sby[y], cy2v = P.cby[y];
    const dyc = P.sty[y] - cy, dyc2 = P.sty[y] - cy2, vy = P.vy[y];
    const pdy = P.sty[y] - ptr.sty;
    let ra = "", rb = "";
    for (let x = 0; x < cols; x++) {
      const v1 = P.sax[x] * cy1 + P.cax[x] * sy1;
      const ddx = P.stx[x] - cx;
      let v = v1 + Math.cos(Math.sqrt(ddx * ddx + dyc * dyc) * 3.6 - t2 * 2.0);
      if (ptr.in) {
        const pdx = P.stx[x] - ptr.stx;
        v += 1.35 * Math.exp(-(pdx * pdx + pdy * pdy) * 6.5);
      }
      const vig = 0.42 + 0.58 * Math.min(1, (P.vx[x] + vy) * 1.05);
      let i1 = ((v + 2.4) / 4.8 * vig * R1) | 0;
      ra += RAMP1[i1 < 0 ? 0 : i1 >= R1 ? R1 - 1 : i1];

      const w1 = P.sbx[x] * cy2v + P.cbx[x] * sy2;
      const ddx2 = P.stx[x] - cx2;
      const w = w1 + Math.cos(Math.sqrt(ddx2 * ddx2 + dyc2 * dyc2) * 5.0 + t2 * 1.6);
      let i2 = ((w + 2.2) / 4.4 * vig * R2) | 0;
      rb += RAMP2[i2 < 0 ? 0 : i2 >= R2 ? R2 - 1 : i2];
    }
    outA.push(ra); outB.push(rb);
  }
  L.bg.textContent = outA.join("\n");
  L.bg2.textContent = outB.join("\n");
}

/* Donut: a1k0n's donut math (a1k0n.net/2011/07/20/donut-math.html),
   as ported in play.core's demos/donut.js — z-buffered torus. */
function buildDonut(t) {
  const A = t * 0.9, B = t * 0.52;
  const cA = Math.cos(A), sA = Math.sin(A), cB = Math.cos(B), sB = Math.sin(B);
  const scaleX = dw / 3.3, scaleY = scaleX * aspect;
  db.fill(" "); dz.fill(0);
  for (let j = 0; j < TAU; j += 0.07) {
    const ct = Math.cos(j), st = Math.sin(j);
    for (let i = 0; i < TAU; i += 0.02) {
      const sp = Math.sin(i), cp = Math.cos(i);
      const h = ct + 2;
      const D = 1 / (sp * h * sA + st * cA + 5);
      const tt = sp * h * cA - st * sA;
      const x = 0 | (dw / 2 + scaleX * D * (cp * h * cB - tt * sB));
      const y = 0 | (dh / 2 + scaleY * D * (cp * h * sB + tt * cB));
      const o = x + dw * y;
      const N = 0 | (8 * ((st * sA - sp * ct * cA) * cB - sp * ct * sA - st * cA - cp * ct * sB));
      if (y >= 0 && y < dh && x >= 0 && x < dw && D > dz[o]) {
        dz[o] = D;
        db[o] = DRAMP[N > 0 ? N : 0];
      }
    }
  }
  let out = "";
  for (let y = 0; y < dh; y++) {
    out += db.slice(y * dw, y * dw + dw).join("") + (y < dh - 1 ? "\n" : "");
  }
  L.donut.textContent = out;
}

function stamp(x, y, lines) {
  for (let j = 0; j < lines.length; j++) {
    const gy = y + j;
    if (gy < 1 || gy >= rows - 1) continue;
    const row = G[gy], s = lines[j];
    for (let i = 0; i < s.length; i++) {
      const ch = s[i], gx = x + i;
      if (ch !== " " && gx > 0 && gx < cols - 1) row[gx] = ch;
    }
  }
}

function barRow(left, mid, right) {
  let row;
  if (left.length + mid.length + right.length + 8 <= cols) {
    const gap = cols - left.length - mid.length - right.length;
    const g1 = gap >> 1, g2 = gap - g1;
    row = left + "─".repeat(g1) + mid + "─".repeat(g2) + right;
  } else if (left.length + right.length + 2 <= cols) {
    row = left + "─".repeat(cols - left.length - right.length) + right;
  } else {
    row = (left + right).slice(0, cols).padEnd(cols, "─");
  }
  return row.split("");
}

function buildScene(now) {
  for (let y = 0; y < rows; y++) G[y].fill(" ");

  G[0] = barRow("┌──[ SUPERBOT.GG ]", "AGENTS ─── ARENA ─── DOCS ─── API", "[ CONNECT ]──┐");
  const ptrTxt = String(ptr.col).padStart(3, "0") + "," + String(ptr.row).padStart(3, "0");
  G[rows - 1] = barRow("└──[ © 2026 SUPERBOT.GG — PURE TEXTMODE ]",
    "", "[ FPS " + fpsShown + " ]──[ " + cols + "×" + rows + " ]──[ PTR " + ptrTxt + " ]──┘");
  for (let y = 1; y < rows - 1; y++) { G[y][0] = "│"; G[y][cols - 1] = "│"; }

  stamp(layout.maskX, layout.topY, MASK);
  stamp(((cols - TAG.length) / 2) | 0, layout.tagY, [TAG]);
  const btnLine = BTNS.join("   ");
  stamp(((cols - btnLine.length) / 2) | 0, layout.btnY, [btnLine]);
  stamp(((cols - STATS.length) / 2) | 0, layout.statsY, [STATS]);

  if (now < glitchUntil) {
    for (const gl of glitchRows) {
      const k = ((gl.off % cols) + cols) % cols;
      G[gl.y] = G[gl.y].slice(k).concat(G[gl.y].slice(0, k));
    }
  }

  let out = "";
  for (let y = 0; y < rows; y++) out += G[y].join("") + (y < rows - 1 ? "\n" : "");
  L.scene.textContent = out;
}

function placeMovables(t) {
  const parX = (0.5 - ptr.sx) * 8, parY = (0.5 - ptr.sy) * 5;
  L.logo.style.transform = "translate(" + (layout.logoX * cw + parX) + "px," + (layout.logoY * chh + parY) + "px)";
  if (donutOn) {
    L.donut.style.transform = "translate(" + ((cols - dw - 4) * cw - parX * 1.6) + "px," + ((rows - dh - 2) * chh - parY * 1.6) + "px)";
  }
  L.logo.style.opacity = REDUCED ? 1 : 0.90 + 0.10 * Math.sin(t * 2.1);
}

function setHover(idx) {
  if (idx === hover) return;
  hover = idx;
  if (idx < 0) {
    L.hot.textContent = "";
    stage.style.cursor = "crosshair";
  } else {
    const r = rects[idx];
    L.hot.textContent = r.label;
    L.hot.style.transform = "translate(" + (r.x * cw) + "px," + (r.y * chh) + "px)";
    stage.style.cursor = "pointer";
  }
}

function render(now) {
  const t = now / 1000;
  ptr.stx += (2 * (ptr.col - cols / 2) / Math.min(cols, rows) * aspect - ptr.stx) * 0.09;
  ptr.sty += (2 * (ptr.row - rows / 2) / Math.min(cols, rows) - ptr.sty) * 0.09;

  if (!REDUCED && now > glitchNext) {
    glitchUntil = now + 130;
    glitchNext = now + 3200 + Math.random() * 4200;
    glitchRows = [];
    const n = 2 + (Math.random() * 3 | 0);
    for (let i = 0; i < n; i++) {
      glitchRows.push({
        y: layout.topY + (Math.random() * MH | 0),
        off: (Math.random() < 0.5 ? -1 : 1) * (1 + (Math.random() * 3 | 0))
      });
    }
  }

  buildBg(t);
  if (donutOn) buildDonut(t);
  buildScene(now);
  placeMovables(t);
}

let rafPending = false;
function renderOnce() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(now => { rafPending = false; render(now); });
}

function loop(now) {
  const dt = Math.min(100, now - (loop.last || now));
  loop.last = now;
  if (dt > 0) fpsEma = fpsEma * 0.92 + (1000 / dt) * 0.08;
  if (now - fpsAt > 500) { fpsShown = Math.round(fpsEma); fpsAt = now; }
  render(now);
  requestAnimationFrame(loop);
}

addEventListener("pointermove", e => {
  ptr.col = Math.max(0, Math.min(cols - 1, (e.clientX / cw) | 0));
  ptr.row = Math.max(0, Math.min(rows - 1, (e.clientY / chh) | 0));
  ptr.sx = e.clientX / innerWidth;
  ptr.sy = e.clientY / innerHeight;
  ptr.in = true;
  let idx = -1;
  for (let i = 0; i < rects.length; i++) {
    const r = rects[i];
    if (ptr.row === r.y && ptr.col >= r.x && ptr.col < r.x + r.label.length) { idx = i; break; }
  }
  setHover(idx);
  if (REDUCED) renderOnce();
});
addEventListener("pointerleave", () => { ptr.in = false; setHover(-1); });
addEventListener("pointerdown", () => {
  if (hover < 0) return;
  stage.classList.add("flash");
  setTimeout(() => stage.classList.remove("flash"), 130);
});

let resizeT = 0;
addEventListener("resize", () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { fit(); setHover(-1); if (REDUCED) renderOnce(); }, 120);
});

fit();
if (REDUCED) {
  render(8000);
} else {
  requestAnimationFrame(loop);
}
</script>
</body>
</html>

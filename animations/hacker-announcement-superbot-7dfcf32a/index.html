<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>superbot: the hooded mascot's announcement</title>
<style>
html, body { margin: 0; height: 100%; background: #000; }
video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
</style>
</head>
<body>
<video controls playsinline preload="auto" aria-label="superbot: the hooded mascot's announcement"></video>
<script>
// The cut plays from the gallery's renders (assets/video/<id>.<ratio>.mp4): ?cut=talk picks the mascot-only cut (no chat),
// ?take=licensed the licensed voice, ?ar= (the gallery's ratio picker) the square render for 1:1, 4:5 and 9:16 and the
// wide one otherwise.
const q = new URLSearchParams(location.search);
const id = `hacker-announcement${q.get('cut') === 'talk' ? '-talk' : ''}${q.get('take') === 'licensed' ? '-licensed' : ''}-superbot-7dfcf32a`;
const ar = ['1x1', '4x5', '9x16'].includes(q.get('ar')) ? '1x1' : '16x9';
const v = document.querySelector('video');
v.src = `../../assets/video/${id}.${ar}.mp4`;
// Play with sound when the browser allows it; otherwise start muted and let the controls unmute.
v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>superbot: the hooded mascot's announcement</title>
<style>
html, body { margin: 0; height: 100%; background: #000; }
video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
</style>
</head>
<body>
<video controls playsinline preload="auto" aria-label="superbot: the hooded mascot's announcement"></video>
<script>
// The cut plays from the gallery's renders (assets/video/<id>.<ratio>.mp4): ?spot= picks one of the hooded mascot's spots
// (the announcement by default; ads-src/hacker-announcement-7dfcf32a/spots.json slugs the rest: hello as a montage and
// mascot only, hello-computer a montage only, the rest mascot only),
// ?cut=talk the mascot-only cut (no chat), ?ar= (the gallery's ratio picker) the square
// render at that ratio (16:9 otherwise).
const q = new URLSearchParams(location.search);
const SPOTS = ['announcement', 'hello', 'hello-computer'], TALK_ONLY = ['output', 'jobs', 'when-ais-fail', 'message', 'stop-paying-api', 'does-things'];
const spot = [...SPOTS, ...TALK_ONLY].includes(q.get('spot')) ? q.get('spot') : 'announcement';
const talk = q.get('cut') === 'talk' || TALK_ONLY.includes(spot);
// every cut is in the fish.audio HACKER VOICE (the licensed-voice cuts were retired 2026-10-18)
const id = `hacker-${spot}${talk ? '-talk' : ''}-superbot-7dfcf32a`;
// every spot ships every ratio X lists but 4:3, at 60 fps
const ar = ['16x9', '9x16', '4x5', '1x1'].includes(q.get('ar')) ? q.get('ar') : '16x9';
const v = document.querySelector('video');
v.src = `../../assets/video/${id}.${ar}.mp4`;
// Play with sound when the browser allows it; otherwise start muted and let the controls unmute.
v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
</script>
</body>
</html>

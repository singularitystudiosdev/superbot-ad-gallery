<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>3D Dolly-in Finishers — Standalone Demo</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 28px;
    background: #101014; font-family: -apple-system, "Segoe UI", sans-serif; color: #ddd;
  }
  .stage {
    position: relative; width: 460px; height: 460px;
    background: #060607; border-radius: 24px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .bloom {
    position: absolute; width: 250px; height: 250px; border-radius: 24%;
    background: linear-gradient(135deg, #7c5cff 0%, #38bdf8 60%, #a7f3d0 100%);
    box-shadow: 0 0 40px rgba(124, 92, 255, .35);
    will-change: transform, filter;
  }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button {
    background: #1c1c22; color: #eee; border: 1px solid #33333c; border-radius: 10px;
    padding: 9px 16px; font-size: 14px; cursor: pointer;
  }
  button:hover { background: #26262e; }
  h1 { font-size: 16px; font-weight: 600; margin: 0; color: #aaa; }
  #status { font-size: 13px; color: #888; min-height: 18px; }
</style>
</head>
<body>
  <h1>3D Dolly-in finishers — start at IDE-icon size (scale .22), fly at the viewer</h1>
  <div class="stage" id="stage"><div class="bloom" id="bloom"></div></div>
  <div class="controls">
    <button data-fx="dolly-feather">3D Dolly · Feather</button>
    <button data-fx="dolly-warp">3D Dolly · Warp</button>
    <button data-fx="dolly-slow">3D Dolly · Slow Rise</button>
    <button id="replay">Replay</button>
  </div>
  <div id="status"></div>

<script>
// ---- paste-ready dolly-in finishers ----

function dollyFeather(bloom, done) {
  bloom.style.transition = "none";
  bloom.style.transform = "perspective(700px) scale(0.22) rotateX(-14deg)";
  bloom.style.filter = "blur(3px)";
  setTimeout(() => {
    bloom.style.transition =
      "transform .55s cubic-bezier(.16,1,.3,1), filter .45s ease-out";
    bloom.style.transform = "perspective(700px) scale(1.05) rotateX(0deg)";
    bloom.style.filter = "blur(0px)";
  }, 30);
  setTimeout(() => {
    bloom.style.transition = "transform .18s ease-out";
    bloom.style.transform = "perspective(700px) scale(1)";
    bloom.style.filter = "none";
  }, 600);
  setTimeout(done, 780);
}

function dollyWarp(bloom, done) {
  bloom.style.transition = "none";
  bloom.style.transform = "perspective(900px) scale(0.12)";
  bloom.style.filter = "blur(9px)";
  setTimeout(() => {
    bloom.style.transition =
      "transform .28s ease-in, filter .28s ease-in";
    bloom.style.transform = "perspective(900px) scale(0.55)";
    bloom.style.filter = "blur(4px)";
  }, 30);
  setTimeout(() => {
    bloom.style.transition =
      "transform .3s cubic-bezier(.16,1,.3,1), filter .3s ease-out";
    bloom.style.transform = "perspective(900px) scale(1.02)";
    bloom.style.filter = "blur(0px)";
  }, 330);
  setTimeout(() => {
    bloom.style.transition = "transform .14s ease-out";
    bloom.style.transform = "perspective(900px) scale(1)";
    bloom.style.filter = "none";
  }, 660);
  setTimeout(done, 820);
}

function dollySlow(bloom, done) {
  bloom.style.transition = "none";
  bloom.style.transform = "perspective(1000px) scale(0.25) rotateY(10deg)";
  bloom.style.filter = "blur(2px)";
  setTimeout(() => {
    bloom.style.transition =
      "transform 1s cubic-bezier(.25,.7,.3,1), filter 1s ease-out";
    bloom.style.transform = "perspective(1000px) scale(1.03) rotateY(0deg)";
    bloom.style.filter = "blur(0px)";
  }, 30);
  setTimeout(() => {
    bloom.style.transition = "transform .25s ease-out";
    bloom.style.transform = "perspective(1000px) scale(1)";
    bloom.style.filter = "none";
  }, 1060);
  setTimeout(done, 1330);
}

// ---- wiring ----
const bloom = document.getElementById("bloom");
// Per-fx done counters — incremented by BOTH entry paths (button play() and ?fx= auto).
window.__doneFired = { "dolly-feather": 0, "dolly-warp": 0, "dolly-slow": 0 };
const FX = {
  "dolly-feather": { fn: dollyFeather, dur: 780 },
  "dolly-warp":    { fn: dollyWarp,    dur: 820 },
  "dolly-slow":    { fn: dollySlow,    dur: 1330 },
};
const START = {
  "dolly-feather": { t: "perspective(700px) scale(0.22) rotateX(-14deg)", f: "blur(3px)" },
  "dolly-warp":    { t: "perspective(900px) scale(0.12)",                 f: "blur(9px)" },
  "dolly-slow":    { t: "perspective(1000px) scale(0.25) rotateY(10deg)", f: "blur(2px)" },
};
let busy = false;
function play(key) {
  if (busy) return;
  busy = true;
  bloom.style.transition = "none";
  bloom.style.transform = "scale(1)";
  bloom.style.filter = "none";
  FX[key].fn(bloom, () => {
    busy = false;
    window.__doneFired[key] = (window.__doneFired[key] || 0) + 1;
    document.getElementById("status").textContent = key + " done";
  });
}
document.querySelectorAll("button[data-fx]").forEach((b) =>
  b.addEventListener("click", () => {
    sessionStorage.setItem("dolly-last", b.dataset.fx);
    play(b.dataset.fx);
  })
);
document.getElementById("replay").addEventListener("click", () => {
  const last = sessionStorage.getItem("dolly-last") || "dolly-feather";
  play(last);
});

// Auto-trigger from ?fx=dolly-feather|dolly-warp|dolly-slow: park at the small
// start state for a beat, then run the real effect (real time, observable).
const q = new URLSearchParams(location.search).get("fx");
if (q && FX[q]) {
  bloom.style.transition = "none";
  bloom.style.transform = START[q].t;
  bloom.style.filter = START[q].f;
  const btn = document.querySelector('button[data-fx="' + q + '"]');
  if (btn) sessionStorage.setItem("dolly-last", btn.dataset.fx);
  setTimeout(() => {
    busy = true;
    FX[q].fn(bloom, () => {
      busy = false;
      window.__doneFired[q] = (window.__doneFired[q] || 0) + 1;
      document.getElementById("status").textContent = q + " done";
    });
  }, 400);
}
</script>
</body>
</html>

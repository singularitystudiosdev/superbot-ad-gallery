<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>3D Flip Reveals — orbit-merge loader → two-faced flip card</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    background: #101014; font-family: -apple-system, "Segoe UI", sans-serif; color: #ddd;
    overflow: hidden;
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0; color: #aaa; text-align: center; }

  .stage-holder { position: relative; }
  .stage {
    position: relative; width: 460px; height: 460px;
    background: #060607; border-radius: 24px;
    box-shadow: 0 0 0 1px rgba(255,255,255,.07), 0 40px 120px -40px rgba(0,0,0,.9);
    overflow: hidden; cursor: pointer; /* click to replay */
  }

  /* ---- orbit-merge loader plumbing (from hero-loading-animations.html) ---- */
  .ico-tile {
    position: absolute; left: 0; top: 0;
    border-radius: 24%; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 10px 26px -8px rgba(0,0,0,.85);
    will-change: transform, opacity, filter;
  }
  .ico-tile img { width: 100%; height: 100%; display: block; pointer-events: none; user-select: none; }

  /* ---- the reveal: a real two-faced 3D flip card (DeSandro card-flip shape) ----
     scene (perspective) > card (preserve-3d) > two absolutely-positioned faces,
     each backface-visibility:hidden, back face pre-rotated rotateY(180deg).
     The mirror-through problem of the old single-faced bloom is gone by construction:
     at any angle exactly one face is toward the camera. */
  .flip-scene {
    position: absolute; left: 50%; top: 50%;
    width: 250px; height: 250px; margin: -125px 0 0 -125px;
    perspective: 900px;
    opacity: 0; pointer-events: none; z-index: 10;
  }
  .flip-card {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
    will-change: transform, filter;
  }
  .face {
    position: absolute; inset: 0;
    border-radius: 24%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .face.front {
    overflow: hidden; background: #0a0a0c;
    /* ring + glow + drop, same as the source .bloom */
    box-shadow:
      0 0 0 1px rgba(255,255,255,.14),
      0 0 100px rgba(255,255,255,.1),
      0 30px 90px -20px rgba(0,0,0,.95);
  }
  .face.front img { width: 100%; height: 100%; display: block; border-radius: inherit; }
  .face.back {
    transform: rotateY(180deg);
    /* default back: solid black disc + ring; variants restyle via back(el, api) */
    background: #0a0a0c;
    box-shadow: 0 0 0 1px rgba(255,255,255,.14);
  }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 720px; }
  button {
    background: #1c1c22; color: #eee; border: 1px solid #33333c; border-radius: 10px;
    padding: 9px 16px; font-size: 13px; cursor: pointer;
    transition: background .15s, color .15s;
  }
  button:hover { background: #26262e; }
  button.active { background: #f2f2f5; color: #0a0a0c; border-color: #f2f2f5; font-weight: 600; }
  #status { font-size: 13px; color: #888; min-height: 18px; text-align: center; }
</style>
</head>
<body>
  <h1>3D Flip Reveals — merge → hide tiles instantly → two-faced flip card</h1>
  <div class="stage-holder" id="stage-holder">
    <div class="stage" id="stage">
      <div id="globe"></div>
      <div class="flip-scene" id="flip-scene">
        <div class="flip-card" id="flip-card">
          <div class="face front" id="face-front"><img src="hero-assets/bloom.png" alt="rainbow bench app icon" draggable="false"></div>
          <div class="face back" id="face-back"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="controls" id="fx-list"></div>
  <div class="controls"><button id="replay">Replay</button></div>
  <div id="status"></div>

<script>
// Variant registry contract — variant files do exactly this:
//   window.FLIP_VARIANTS.push({
//     id: "clean",            // unique id; file must be hero-flip-variants/<id>.356321a5.js
//     name: "Flip · Clean",   // button + status label
//     dur: 830,               // OPTIONAL ms total (harness uses it to time the mid-flip shot)
//     back(backEl, api) {},   // OPTIONAL: style api.back; default is solid #0a0a0c + ring
//     run(api, done) {},      // REQUIRED: play the flip on api.card with staged timeouts,
//   });                       //   call api.hideTiles() first (belt-and-braces), fire done() last
// api = { card, front, back, hideTiles, showTiles, ICON_SIZE: 54, progress(pct, label) }
window.FLIP_VARIANTS = window.FLIP_VARIANTS || [];
window.__FLIP_DUR = window.__FLIP_DUR || {};
window.__doneFired = window.__doneFired || {};
</script>

<!-- built-in variant, materialized below -->
<script src="hero-flip-variants/clean.356321a5.js"></script>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const SKIP = params.get("t") === "skip" ? 12 : 1; // ?t=skip fast-forwards the spin
  const wanted = (params.get("v") || "").split(",").map(s => s.trim()).filter(Boolean);
  const autoFx = params.get("fx") || "";

  const stage = document.getElementById("stage");
  const globe = document.getElementById("globe");
  const scene = document.getElementById("flip-scene");
  const card = document.getElementById("flip-card");
  const frontFace = document.getElementById("face-front");
  const backFace = document.getElementById("face-back");
  const statusEl = document.getElementById("status");

  function progress(pct, label) {
    const p = Math.max(0, Math.min(100, pct));
    statusEl.textContent = label ? label + " · " + Math.round(p) + "%" : "";
  }

  // ---- dynamic variant loading (?v=id1,id2) BEFORE materializing the registry ----
  // Ids already present (statically included) are skipped; unknown ids 404 and are
  // ignored silently. All injections settle before buttons/selection are built.
  function loadVariant(id) {
    return new Promise((res) => {
      if (window.FLIP_VARIANTS.some(v => v.id === id)) return res(false);
      const s = document.createElement("script");
      s.src = "hero-flip-variants/" + id + ".356321a5.js";
      s.onload = () => res(true);
      s.onerror = () => { s.remove(); res(false); }; // unknown ?v id — ignored
      document.head.appendChild(s);
    });
  }

  Promise.all(wanted.map(loadVariant)).then(() => {
    window.FLIP_VARIANTS.forEach(v => {
      if (!(v.id in window.__doneFired)) window.__doneFired[v.id] = 0;
      window.__FLIP_DUR[v.id] = v.dur || 0;
    });

    let registry = window.FLIP_VARIANTS.slice();
    if (!registry.length) { progress(0, "no variants loaded"); return; }

    let currentFx = "clean";
    let stored = null;
    try { stored = sessionStorage.getItem("flip-last"); } catch (e) {}
    if (autoFx && registry.some(v => v.id === autoFx)) currentFx = autoFx;
    else if (stored && registry.some(v => v.id === stored)) currentFx = stored;

    // ---- controls ----
    const fxList = document.getElementById("fx-list");
    registry.forEach(v => {
      const b = document.createElement("button");
      b.dataset.fx = v.id;
      b.textContent = v.name;
      b.addEventListener("click", () => {
        try { sessionStorage.setItem("flip-last", v.id); } catch (e) {}
        setFx(v.id);
      });
      fxList.appendChild(b);
    });
    function markActive() {
      [...fxList.children].forEach(b => b.classList.toggle("active", b.dataset.fx === currentFx));
    }
    markActive();
    function setFx(id) {
      if (!registry.some(v => v.id === id)) return;
      currentFx = id;
      markActive();
      reset();
    }

    // ---- orbit-merge loader plumbing (adapted from hero-loading-animations.html) ----
    const STAGE = 460;
    const lerp = (a, b, t) => a + (b - a) * t;
    const clamp01 = t => Math.min(1, Math.max(0, t));
    const rotY3 = (v, a) => ({ x: v.x * Math.cos(a) + v.z * Math.sin(a), y: v.y, z: -v.x * Math.sin(a) + v.z * Math.cos(a) });
    function fibDirs(n) {
      return Array.from({ length: n }, (_, i) => {
        const y = 1 - (2 * i + 1) / n;
        const r = Math.sqrt(Math.max(0, 1 - y * y));
        const th = 2.399963 * i;
        return { x: Math.cos(th) * r, y, z: Math.sin(th) * r };
      });
    }
    const ICONS = [
      { name: "Cursor", src: "hero-assets/cursor.png" },
      { name: "ChatGPT", src: "hero-assets/chatgpt.webp" },
      { name: "Claude", src: "hero-assets/claude.png" },
      { name: "Hermes", src: "hero-assets/hermes.png" },
      { name: "VS Code", src: "hero-assets/vscode.png" },
      { name: "Windsurf", src: "hero-assets/windsurf.ico" },
      { name: "JetBrains", src: "hero-assets/jetbrains.png" },
      { name: "GitHub", src: "hero-assets/github.png" },
      { name: "Warp", src: "hero-assets/warp.png" },
      { name: "Zed", src: "hero-assets/zed.png" },
      { name: "Neovim", src: "hero-assets/neovim.ico" },
      { name: "iTerm2", src: "hero-assets/iterm2.jpg" },
      { name: "Gemini", src: "hero-assets/gemini.svg" },
      { name: "Android Studio", src: "hero-assets/androidstudio.svg" },
      { name: "GitPod", src: "hero-assets/gitpod.ico" },
      { name: "Kiro", src: "hero-assets/kiro.ico" },
      { name: "DevDocs", src: "hero-assets/devdocs.ico" },
      { name: "Sublime Text", src: "hero-assets/sublime.ico" },
    ];
    const FIB = fibDirs(ICONS.length);
    const N = ICONS.length;
    const ICON_SIZE = 54;
    const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const MERGE_T = 4000;
    const POP_START = 120, POP_STAGGER = 48;
    const popAt = i => POP_START + i * POP_STAGGER;
    const OMEGA0 = 0.35, OMEGA_MAX = 21;
    const omegaAt = tMs => {
      const x = clamp01(tMs / MERGE_T);
      return OMEGA0 * Math.exp(Math.log(OMEGA_MAX / OMEGA0) * Math.pow(x, 1.55));
    };

    function iconEl(icon, size) {
      const d = document.createElement("div");
      d.className = "ico-tile";
      d._size = size;
      d.style.width = d.style.height = size + "px";
      const img = document.createElement("img");
      img.src = icon.src; img.alt = icon.name; img.draggable = false;
      d.appendChild(img);
      return d;
    }
    function place3(el, x, y, z, s) {
      const size = el._size * s;
      el.style.transform =
        "translate3d(" + (STAGE / 2 - size / 2 + x) + "px," + (STAGE / 2 - size / 2 + y) + "px," + z + "px) scale(" + s + ")";
    }

    const bs = ICONS.map(icon => {
      const b = iconEl(icon, ICON_SIZE);
      b.style.opacity = "0";
      globe.appendChild(b);
      return b;
    });

    // Tiles are never faded — once the flip owns the stage they go visibility:hidden
    // INSTANTLY, before the card's first frame, so nothing can ever appear behind it.
    let tilesHidden = false;
    function hideTiles() {
      if (tilesHidden) return;
      tilesHidden = true;
      bs.forEach(b => { b.style.visibility = "hidden"; });
    }
    function showTiles() {
      tilesHidden = false;
      bs.forEach(b => { b.style.visibility = ""; });
    }

    let phase = "idle"; // pop → spin → finisher → done
    let clock = 0, ang = 0;
    let fxGen = 0;
    let raf = 0;
    const lastRef = { v: performance.now() };

    function frameDelta() {
      const now = performance.now();
      const d = Math.min(now - lastRef.v, 34);
      lastRef.v = now;
      return d * (REDUCED ? 0.3 : 1) * SKIP;
    }

    function renderMergedFrame() {
      for (let i = 0; i < N; i++) {
        const b = bs[i];
        if (!b._popped) { b.style.opacity = "0"; continue; }
        const v = rotY3(FIB[i], ang);
        const mergeT = Math.pow(clamp01((clock - (MERGE_T - 450)) / 450), 1.7);
        const x = lerp(v.x * 175, 0, mergeT), y = lerp(v.y * 175, 0, mergeT), z = v.z * lerp(175, 10, mergeT);
        const depth = (z + 190) / 380;
        place3(b, x, y, z, 1);
        b.style.opacity = String(Math.min(1, 0.16 + 0.84 * depth));
        const blurT = clamp01((clock - MERGE_T * 0.62) / (MERGE_T * 0.38));
        const blur = Math.pow(blurT, 2) * 3.6 + (depth < 0.5 ? (0.5 - depth) * 3 : 0);
        b.style.filter = blur > 0.05 ? "blur(" + blur.toFixed(2) + "px)" : "none";
      }
    }

    function runFinisher() {
      const variant = registry.find(v => v.id === currentFx) || registry[0];
      const gen = ++fxGen;
      phase = "finisher";
      hideTiles(); // CLEANUP SEAM: instant, before the finisher's first frame
      scene.style.opacity = "1";
      progress(100, "rainbow bench");
      if (typeof variant.back === "function") variant.back(backFace, api);
      variant.run(api, () => {
        if (gen !== fxGen) return; // a reset happened mid-effect
        phase = "done";
        window.__doneFired[variant.id] = (window.__doneFired[variant.id] || 0) + 1;
        progress(100, variant.name + " done");
      });
    }
    const api = {
      card, front: frontFace, back: backFace,
      hideTiles, showTiles, ICON_SIZE,
      progress,
    };

    function tickFn() {
      const dMs = frameDelta();
      clock += dMs;
      ang += (dMs / 1000) * omegaAt(Math.min(clock, MERGE_T));
      for (let i = 0; i < N; i++) {
        if (clock >= popAt(i) && !bs[i]._popped) { bs[i]._popped = true; bs[i].style.opacity = "1"; }
      }
      if (!tilesHidden) renderMergedFrame();
      // loader status only — once the finisher owns the stage it owns the status line
      if (phase !== "finisher" && phase !== "done") {
        progress(Math.min(100, (clock / MERGE_T) * 100),
          clock < 900 ? "IDEs popping in" : clock / MERGE_T < 0.75 ? "Spinning up — exponential" : "Merging");
      }
      if (clock >= MERGE_T && phase !== "finisher" && phase !== "done") runFinisher();
    }

    function reset() {
      fxGen++; // invalidate any in-flight variant
      phase = "pop";
      clock = 0; ang = 0;
      showTiles();
      scene.style.opacity = "0";
      card.style.transition = "none";
      card.style.transform = "scale(1)";
      card.style.filter = "none";
      backFace.style.cssText = ""; // restore default back face
      backFace.textContent = "";
      bs.forEach(b => { b._popped = false; b.style.opacity = "0"; b.style.filter = "none"; });
      lastRef.v = performance.now();
    }

    function startLoader() {
      if (REDUCED) {
        // reduced motion: one composed frame — formed sphere, no merge, no loop
        clock = MERGE_T * 0.45; ang = 1.2;
        for (let i = 0; i < N; i++) { bs[i]._popped = true; bs[i].style.opacity = "1"; }
        bs.forEach((b, i) => {
          const v = rotY3(FIB[i], ang);
          place3(b, v.x * 175, v.y * 175, v.z * 175, 1);
          b.style.filter = "none";
        });
        progress(45, "3D sphere — static");
        return;
      }
      reset();
      const loop = () => { tickFn(); raf = requestAnimationFrame(loop); };
      raf = requestAnimationFrame(loop);
    }

    // replay: stage click or the replay button
    stage.addEventListener("click", () => reset());
    document.getElementById("replay").addEventListener("click", () => reset());

    // ---- fitStage: scale the fixed 460px stage to the viewport ----
    const stageHolder = document.getElementById("stage-holder");
    function fitStage() {
      const s = Math.min(window.innerWidth, window.innerHeight - 170) / STAGE;
      const scale = Math.max(0.3, Math.min(1.2, s));
      stageHolder.style.transform = "scale(" + scale + ")";
    }
    window.addEventListener("resize", fitStage);
    fitStage();

    startLoader();
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flip Reveal · Snap</title>
<style>
/* Monochrome shell; the animation owns the screen, the finisher editor docks right. */

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  overflow: hidden;
  font-family: "SF Pro Text", "Inter", system-ui, sans-serif;
  color: #f2f2f5;
  background:
    radial-gradient(rgba(255, 255, 255, 0.05) 1.2px, transparent 1.4px) 0 0 / 20px 20px,
    #0a0a0c;
}

.app { display: flex; height: 100vh; }

.anim-area {
  flex: 1;
  position: relative;
  display: grid;
  place-items: center;
  min-width: 0;
}

/* fixed 460px coordinate space, scaled to fit the area */
.stage-holder { position: relative; }

.stage {
  position: relative;
  width: 460px;
  height: 460px;
  overflow: hidden;
  border-radius: 24px;
  background: #060607;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.07), 0 40px 120px -40px rgba(0, 0, 0, 0.9);
  cursor: pointer; /* click to replay */
  transform-origin: center;
}

.globe {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  perspective: 1100px;
}

/* real product app icon riding the sphere */
.ico-tile {
  position: absolute;
  left: 0;
  top: 0;
  border-radius: 24%;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.1),
    0 10px 26px -8px rgba(0, 0, 0, 0.85);
  will-change: transform, opacity, filter;
}
.ico-tile img { width: 100%; height: 100%; display: block; pointer-events: none; user-select: none; }

/* finisher layers */

/* the revealed bench icon — appears instantly */
.bloom {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 250px;
  height: 250px;
  margin: -125px 0 0 -125px;
  border-radius: 24%;
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.14),
    0 0 100px rgba(255, 255, 255, 0.1),
    0 30px 90px -20px rgba(0, 0, 0, 0.95);
  opacity: 0;
  transform: scale(1);
  pointer-events: none;
  z-index: 10; /* reveal card paints over the icon tiles */
}
.bloom.show { opacity: 1; }
.bloom img { width: 100%; height: 100%; display: block; border-radius: inherit; }

/* finisher editor */
.editor {
  width: 300px;
  flex-shrink: 0;
  border-left: 1px solid rgba(255, 255, 255, 0.1);
  padding: 20px 16px;
  overflow-y: auto;
  background: rgba(255, 255, 255, 0.02);
}

.editor h2 {
  margin: 0 0 4px;
  font-size: 12px;
  letter-spacing: 0.18em;
  color: rgba(242, 242, 245, 0.55);
  font-weight: 700;
}

.editor .sub { margin: 0 0 16px; font-size: 12px; color: rgba(242, 242, 245, 0.4); }

.fx-list { display: flex; flex-direction: column; gap: 6px; }

.fx-list button {
  font: inherit;
  font-size: 13px;
  text-align: left;
  padding: 9px 12px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(255, 255, 255, 0.03);
  color: #f2f2f5;
  cursor: pointer;
  transition: background 0.15s, transform 0.15s;
}
.fx-list button:hover { background: rgba(255, 255, 255, 0.08); transform: translateX(2px); }
.fx-list button.active { background: #f2f2f5; color: #0a0a0c; border-color: #f2f2f5; font-weight: 600; }

.replay {
  margin-top: 18px;
  width: 100%;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #f2f2f5;
  background: transparent;
  color: #f2f2f5;
  cursor: pointer;
}
.replay:hover { background: rgba(255, 255, 255, 0.1); }

.editor .note { margin: 14px 0 0; font-size: 11.5px; line-height: 1.5; color: rgba(242, 242, 245, 0.35); }
</style>
</head>
<body>
<div class="app">
  <div class="anim-area" id="anim-area">
    <div class="stage-holder" id="stage-holder">
      <div class="stage" id="stage">
        <div class="globe" id="globe"></div>
        <div class="bloom" id="bloom"><img src="hero-assets/bloom.png" alt="rainbow bench app icon" draggable="false" /></div>
      </div>
    </div>
  </div>
  <aside class="editor">
    <h2>FINISHER</h2>
    <p class="sub">what happens when they merge</p>
    <div class="fx-list" id="fx-list"></div>
    <button class="replay" id="replay">Replay</button>
    <p class="note" id="status">Clicking the animation also replays. Selecting a finisher replays with it.</p>
  </aside>
</div>

<script>
// The real app icons — actual assets shipped by each product (hero-assets/).
const ICONS = [
  { name: "Cursor", src: "hero-assets/cursor.png" },
  { name: "ChatGPT", src: "hero-assets/chatgpt.webp" },
  { name: "Claude", src: "hero-assets/claude.png" },
  { name: "Hermes", src: "hero-assets/hermes.png" },
  { name: "VS Code", src: "hero-assets/vscode.png" },
  { name: "Windsurf", src: "hero-assets/windsurf.ico" },
  { name: "JetBrains", src: "hero-assets/jetbrains.png" },
  { name: "GitHub", src: "hero-assets/github.png" },
  { name: "Warp", src: "hero-assets/warp.png" },
  { name: "Zed", src: "hero-assets/zed.png" },
  { name: "Neovim", src: "hero-assets/neovim.ico" },
  { name: "iTerm2", src: "hero-assets/iterm2.jpg" },
  { name: "Gemini", src: "hero-assets/gemini.svg" },
  { name: "Android Studio", src: "hero-assets/androidstudio.svg" },
  { name: "GitPod", src: "hero-assets/gitpod.ico" },
  { name: "Kiro", src: "hero-assets/kiro.ico" },
  { name: "DevDocs", src: "hero-assets/devdocs.ico" },
  { name: "Sublime Text", src: "hero-assets/sublime.ico" },
];
</script>

<script>
const STAGE = 460;
const TAU = Math.PI * 2;

const lerp = (a, b, t) => a + (b - a) * t;
const clamp01 = (t) => Math.min(1, Math.max(0, t));
const smoother = (t) => { const x = clamp01(t); return x * x * x * (x * (x * 6 - 15) + 10); };

function add(el, cls) {
  const d = document.createElement(el);
  if (cls) d.className = cls;
  return d;
}

function iconEl(icon, size) {
  const d = add("div", "ico-tile");
  d._size = size;
  d.style.width = d.style.height = size + "px";
  const img = add("img");
  img.src = icon.src;
  img.alt = icon.name;
  img.draggable = false;
  d.appendChild(img);
  return d;
}

function place3(el, x, y, z, s) {
  const size = el._size * s;
  el.style.transform =
    "translate3d(" + (STAGE / 2 - size / 2 + x) + "px," + (STAGE / 2 - size / 2 + y) + "px," + z + "px) scale(" + s + ")";
}

const rotY3 = (v, a) => ({ x: v.x * Math.cos(a) + v.z * Math.sin(a), y: v.y, z: -v.x * Math.sin(a) + v.z * Math.cos(a) });
function fibDirs(n) {
  return Array.from({ length: n }, (_, i) => {
    const y = 1 - (2 * i + 1) / n;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const th = 2.399963 * i;
    return { x: Math.cos(th) * r, y, z: Math.sin(th) * r };
  });
}
const FIB = fibDirs(ICONS.length);
const N = ICONS.length;
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// timeline: pops (0-0.9s) → exponential spin-up with convergence → merge at MERGE_T
const MERGE_T = 4000;
const POP_START = 120, POP_STAGGER = 48; // each IDE pops in, one at a time, fast
const popAt = (i) => POP_START + i * POP_STAGGER;
// exponential tween, skewed late: slow for most of the run, then detonates
// 0.35 rad/s → 21 rad/s at the merge (power curve makes the tail explosive)
const OMEGA0 = 0.35, OMEGA_MAX = 21;
const omegaAt = (tMs) => {
  const x = clamp01(tMs / MERGE_T);
  return OMEGA0 * Math.exp(Math.log(OMEGA_MAX / OMEGA0) * Math.pow(x, 1.55));
};

function familyRun(ctx) {
  const globe = document.getElementById("globe");
  const bloom = document.getElementById("bloom");

  const bs = ICONS.map((icon) => {
    const b = iconEl(icon, 54);
    b.style.opacity = "0";
    globe.appendChild(b);
    return b;
  });

  let currentFx = sessionStorage.getItem("finisher") || "rise3d";
  let phase = "pop"; // pop → spin → merging → finisher → done
  let clock = 0, ang = 0;
  let fxStop = null;
  const lastRef = { v: performance.now() };
  let raf;

  function frameDelta() {
    const now = performance.now();
    let d = Math.min(now - lastRef.v, 34);
    lastRef.v = now;
    return d * speedFactor();
  }
  function speedFactor() {
    return REDUCED ? 0.3 : 1;
  }

  // --- finisher effects -------------------------------------------------
  const rand = (a, b) => a + Math.random() * (b - a);

  // screen shake on the stage holder (its transform is otherwise unused)
  function shake(mag = 12, dur = 450) {
    const el = document.getElementById("stage-holder");
    const t0 = performance.now();
    (function j(now) {
      const t = clamp01((now - t0) / dur);
      if (t >= 1) { el.style.transform = "none"; return; }
      const m = mag * (1 - t) * (1 - t);
      el.style.transform = "translate(" + rand(-m, m).toFixed(1) + "px," + rand(-m, m).toFixed(1) + "px)";
      requestAnimationFrame(j);
    })(t0);
  }


  const EFFECTS = [
    {
      id: "rise3d", name: "3D Rise",
      run(done) {
        // starts smaller, bends up in 3D, settles slightly bigger then to rest
        bloom.style.transition = "transform .34s cubic-bezier(.2,.9,.3,1)";
        bloom.style.transform = "perspective(700px) scale(0.6) rotateX(-72deg)";
        setTimeout(() => {
          bloom.style.transition = "transform .3s cubic-bezier(.16,1,.3,1)";
          bloom.style.transform = "perspective(700px) scale(1.12) rotateX(16deg)";
        }, 350);
        setTimeout(() => {
          bloom.style.transition = "transform .22s ease-out";
          bloom.style.transform = "scale(1)";
        }, 660);
        setTimeout(done, 840);
      },
    },
    {
      id: "feather", name: "3D Feather",
      run(done) {
        // really light: a shallow tilt and a small settle, almost a breath
        bloom.style.transition = "transform .22s cubic-bezier(.25,.8,.3,1)";
        bloom.style.transform = "perspective(700px) scale(0.88) rotateX(-22deg)";
        setTimeout(() => {
          bloom.style.transition = "transform .28s cubic-bezier(.16,1,.3,1)";
          bloom.style.transform = "perspective(700px) scale(1.03) rotateX(0deg)";
        }, 230);
        setTimeout(() => {
          bloom.style.transition = "transform .18s ease-out";
          bloom.style.transform = "scale(1)";
        }, 520);
        setTimeout(done, 640);
      },
    },
    {
      id: "feather-soft", name: "Feather Softer",
      run(done) {
        // even lighter than Feather: a whisper of a tilt
        bloom.style.transition = "transform .2s cubic-bezier(.25,.8,.3,1)";
        bloom.style.transform = "perspective(700px) scale(0.94) rotateX(-10deg)";
        setTimeout(() => {
          bloom.style.transition = "transform .3s cubic-bezier(.16,1,.3,1)";
          bloom.style.transform = "scale(1)";
        }, 210);
        setTimeout(done, 560);
      },
    },
    {
      id: "feather-drift", name: "Feather Drift",
      run(done) {
        // light tilt with a slow upward drift as it settles
        bloom.style.transition = "transform .24s cubic-bezier(.25,.8,.3,1)";
        bloom.style.transform = "perspective(700px) scale(0.9) rotateX(-18deg) translateY(8px)";
        setTimeout(() => {
          bloom.style.transition = "transform .34s cubic-bezier(.16,1,.3,1)";
          bloom.style.transform = "perspective(700px) scale(1.02) translateY(-4px)";
        }, 250);
        setTimeout(() => {
          bloom.style.transition = "transform .22s ease-out";
          bloom.style.transform = "scale(1)";
        }, 560);
        setTimeout(done, 720);
      },
    },
    {
      id: "turn-left-soft", name: "3D Turn In · Left",
      run(done) {
        // much less dramatic: a gentle bank from the left, settles flat
        bloom.style.transition = "transform .28s cubic-bezier(.22,.9,.35,1)";
        bloom.style.transform = "perspective(700px) translateX(-16px) scale(0.86) rotateY(-34deg)";
        setTimeout(() => {
          bloom.style.transition = "transform .3s cubic-bezier(.16,1,.3,1)";
          bloom.style.transform = "perspective(700px) translateX(0) scale(1.04) rotateY(6deg)";
        }, 290);
        setTimeout(() => {
          bloom.style.transition = "transform .2s ease-out";
          bloom.style.transform = "scale(1)";
        }, 590);
        setTimeout(done, 760);
      },
    },
    {
      id: "turn-right-soft", name: "3D Turn In · Right",
      run(done) {
        // mirror: a gentle bank from the right, settles flat
        bloom.style.transition = "transform .28s cubic-bezier(.22,.9,.35,1)";
        bloom.style.transform = "perspective(700px) translateX(16px) scale(0.86) rotateY(34deg)";
        setTimeout(() => {
          bloom.style.transition = "transform .3s cubic-bezier(.16,1,.3,1)";
          bloom.style.transform = "perspective(700px) translateX(0) scale(1.04) rotateY(-6deg)";
        }, 290);
        setTimeout(() => {
          bloom.style.transition = "transform .2s ease-out";
          bloom.style.transform = "scale(1)";
        }, 590);
        setTimeout(done, 760);
      },
    },
    {
      id: "toward", name: "3D Approach",
      run(done) {
        // starts small and distant, flies toward the screen, then settles
        bloom.style.transition = "transform .34s cubic-bezier(.3,.6,.4,1)";
        bloom.style.transform = "perspective(700px) scale(0.3)";
        setTimeout(() => {
          bloom.style.transition = "transform .22s cubic-bezier(.2,1.2,.4,1)";
          bloom.style.transform = "perspective(700px) scale(1.07)";
        }, 350);
        setTimeout(() => {
          bloom.style.transition = "transform .2s ease-out";
          bloom.style.transform = "scale(1)";
        }, 570);
        setTimeout(done, 740);
      },
    },
    {
      id: "toward-tilt", name: "3D Approach · Tilt",
      run(done) {
        // comes at the screen slightly banked, straightens as it lands
        bloom.style.transition = "transform .32s cubic-bezier(.3,.6,.4,1)";
        bloom.style.transform = "perspective(700px) scale(0.35) rotateY(26deg)";
        setTimeout(() => {
          bloom.style.transition = "transform .24s cubic-bezier(.2,1.2,.4,1)";
          bloom.style.transform = "perspective(700px) scale(1.06) rotateY(-7deg)";
        }, 330);
        setTimeout(() => {
          bloom.style.transition = "transform .2s ease-out";
          bloom.style.transform = "scale(1)";
        }, 570);
        setTimeout(done, 750);
      },
    },
    {
      id: "toward-dash", name: "3D Dash",
      run(done) {
        // fast approach that stops hard, one light shake tick on impact
        shake(3, 160);
        bloom.style.transition = "transform .26s cubic-bezier(.55,0,.9,.6)";
        bloom.style.transform = "perspective(700px) scale(0.12)";
        setTimeout(() => {
          bloom.style.transition = "transform .12s cubic-bezier(.85,0,.7,.8)";
          bloom.style.transform = "perspective(700px) scale(1.05)";
        }, 270);
        setTimeout(() => {
          bloom.style.transition = "transform .18s ease-out";
          bloom.style.transform = "scale(1)";
        }, 400);
        setTimeout(done, 580);
      },
    },
    {
      id: "shimmer", name: "3D Shimmer",
      run(done) {
        // super light 3D shake: tiny alternating tilts, barely visible, then rest
        const seq = [
          "perspective(700px) rotateX(2deg) rotateZ(1.4deg)",
          "perspective(700px) rotateX(-2deg) rotateZ(-1.4deg)",
          "perspective(700px) rotateX(1.4deg) rotateZ(1deg)",
          "perspective(700px) rotateX(-1deg) rotateZ(-0.6deg)",
          "scale(1)",
        ];
        let i = 0;
        const step = () => {
          if (i >= seq.length) { setTimeout(done, 40); return; }
          bloom.style.transition = "transform 70ms ease-in-out";
          bloom.style.transform = seq[i++];
          setTimeout(step, 78);
        };
        step();
      },
    },
    {
      id: "quake-pop", name: "3D Quake Pop",
      run(done) {
        // small pop with a super light shake underneath
        shake(3, 220);
        bloom.style.transition = "transform .18s cubic-bezier(.3,1.5,.4,1)";
        bloom.style.transform = "perspective(700px) scale(0.82)";
        setTimeout(() => {
          bloom.style.transition = "transform .2s ease-out";
          bloom.style.transform = "scale(1)";
        }, 190);
        setTimeout(done, 420);
      },
    },
    {
      id: "deep", name: "3D Deep Dive",
      run(done) {
        // the most 3D: folds up from lying flat with a long perspective sweep
        bloom.style.transition = "transform .4s cubic-bezier(.25,.7,.35,1)";
        bloom.style.transform = "perspective(1000px) rotateX(-84deg) scale(0.62)";
        setTimeout(() => {
          bloom.style.transition = "transform .3s cubic-bezier(.2,1.3,.4,1)";
          bloom.style.transform = "perspective(1000px) rotateX(12deg) scale(1.1)";
        }, 410);
        setTimeout(() => {
          bloom.style.transition = "transform .22s ease-out";
          bloom.style.transform = "scale(1)";
        }, 720);
        setTimeout(done, 920);
      },
    },
    {
      id: "deep-twist", name: "3D Deep Twist",
      run(done) {
        // two-axis fold: deep on X, banked on Y, twists flat
        bloom.style.transition = "transform .38s cubic-bezier(.25,.7,.35,1)";
        bloom.style.transform = "perspective(900px) rotateX(-66deg) rotateY(-42deg) scale(0.52)";
        setTimeout(() => {
          bloom.style.transition = "transform .3s cubic-bezier(.2,1.25,.4,1)";
          bloom.style.transform = "perspective(900px) rotateX(9deg) rotateY(8deg) scale(1.09)";
        }, 390);
        setTimeout(() => {
          bloom.style.transition = "transform .22s ease-out";
          bloom.style.transform = "scale(1)";
        }, 700);
        setTimeout(done, 900);
      },
    },
    {
      id: "corner-tr", name: "3D Bend · Top-Right",
      run(done) {
        // hinged at the top-right corner: that corner stays put while the rest unfolds
        bloom.style.transformOrigin = "86% 14%";
        bloom.style.transition = "transform .32s cubic-bezier(.22,.9,.35,1)";
        bloom.style.transform = "perspective(700px) scale(0.7) rotateY(40deg) rotateX(-26deg)";
        setTimeout(() => {
          bloom.style.transition = "transform .3s cubic-bezier(.16,1,.3,1)";
          bloom.style.transform = "perspective(700px) scale(1.06) rotateY(-7deg) rotateX(4deg)";
        }, 330);
        setTimeout(() => {
          bloom.style.transition = "transform .22s ease-out";
          bloom.style.transformOrigin = "50% 50%";
          bloom.style.transform = "scale(1)";
        }, 640);
        setTimeout(done, 820);
      },
    },
    {
      id: "corner-tl", name: "3D Bend · Top-Left",
      run(done) {
        // hinged at the top-left corner, unfolds flat
        bloom.style.transformOrigin = "14% 14%";
        bloom.style.transition = "transform .32s cubic-bezier(.22,.9,.35,1)";
        bloom.style.transform = "perspective(700px) scale(0.7) rotateY(-40deg) rotateX(-26deg)";
        setTimeout(() => {
          bloom.style.transition = "transform .3s cubic-bezier(.16,1,.3,1)";
          bloom.style.transform = "perspective(700px) scale(1.06) rotateY(7deg) rotateX(4deg)";
        }, 330);
        setTimeout(() => {
          bloom.style.transition = "transform .22s ease-out";
          bloom.style.transformOrigin = "50% 50%";
          bloom.style.transform = "scale(1)";
        }, 640);
        setTimeout(done, 820);
      },
    },
    {
      id: "corner-br", name: "3D Bend · Bottom-Right",
      run(done) {
        // hinged at the bottom-right corner, folds up flat
        bloom.style.transformOrigin = "86% 86%";
        bloom.style.transition = "transform .32s cubic-bezier(.22,.9,.35,1)";
        bloom.style.transform = "perspective(700px) scale(0.72) rotateY(32deg) rotateX(24deg)";
        setTimeout(() => {
          bloom.style.transition = "transform .3s cubic-bezier(.16,1,.3,1)";
          bloom.style.transform = "perspective(700px) scale(1.05) rotateY(-6deg) rotateX(-4deg)";
        }, 330);
        setTimeout(() => {
          bloom.style.transition = "transform .22s ease-out";
          bloom.style.transformOrigin = "50% 50%";
          bloom.style.transform = "scale(1)";
        }, 640);
        setTimeout(done, 820);
      },
    },
    {
      id: "turn-left-slow", name: "3D Slow Rotate · Left",
      run(done) {
        // one slow unhurried rotation in from the left, lands flat
        bloom.style.transition = "transform 1.15s cubic-bezier(.35,.15,.35,1)";
        bloom.style.transform = "perspective(800px) rotateY(78deg) scale(0.82)";
        setTimeout(() => {
          bloom.style.transition = "transform .2s ease-out";
          bloom.style.transform = "scale(1)";
        }, 1160);
        setTimeout(done, 1380);
      },
    },
    {
      id: "turn-right-slow", name: "3D Slow Rotate · Right",
      run(done) {
        // mirror: one slow unhurried rotation in from the right
        bloom.style.transition = "transform 1.15s cubic-bezier(.35,.15,.35,1)";
        bloom.style.transform = "perspective(800px) rotateY(-78deg) scale(0.82)";
        setTimeout(() => {
          bloom.style.transition = "transform .2s ease-out";
          bloom.style.transform = "scale(1)";
        }, 1160);
        setTimeout(done, 1380);
      },
    },
    {
      id: "half-spin-left", name: "3D Half Spin · Left",
      run(done) {
        // a full half-turn on Y while growing, then rest
        bloom.style.transition = "transform 1s cubic-bezier(.4,.1,.3,1)";
        bloom.style.transform = "perspective(800px) rotateY(-180deg) scale(0.62)";
        setTimeout(() => {
          bloom.style.transition = "transform .22s cubic-bezier(.16,1,.3,1)";
          bloom.style.transform = "scale(1)";
        }, 1020);
        setTimeout(done, 1260);
      },
    },
    {
      id: "titan", name: "3D Titan Slam",
      run(done) {
        // heavy: two full 360 spins while growing, then a hard slam with shake
        bloom.style.transformOrigin = "50% 55%";
        bloom.style.transition = "transform .55s cubic-bezier(.5,0,.7,.4)";
        bloom.style.transform = "perspective(800px) scale(0.35) rotateY(-720deg) rotateX(-18deg)";
        setTimeout(() => {
          bloom.style.transition = "transform .18s cubic-bezier(.85,0,.6,1)";
          bloom.style.transform = "perspective(800px) scale(1.35) rotateY(0deg)";
        }, 560);
        setTimeout(() => {
          shake(10, 300);
          bloom.style.transition = "transform .26s cubic-bezier(.16,1,.3,1)";
          bloom.style.transformOrigin = "50% 50%";
          bloom.style.transform = "scale(1)";
        }, 740);
        setTimeout(done, 1000);
      },
    },
    {
      id: "sheen-diag", name: "3D Sheen · Diagonal",
      run(done) {
        const run = sheenBegin();
        const band = document.createElement("div");
        band.style.cssText =
          "position:absolute;top:0;left:-110%;width:220%;height:100%;pointer-events:none;" +
          "background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);" +
          "transform:translateX(-30%)";
        sheenBand = band;
        bloom.appendChild(band);
        void band.offsetWidth; // commit start position before transitioning
        band.style.transition = "transform .48s cubic-bezier(.4,0,.2,1)";
        band.style.transform = "translateX(130%)";
        sheenAt(run, 500, () => sheenSettle(run, band));
        sheenAt(run, 520, done);
      },
    },
    {
      id: "sheen-gleam", name: "3D Sheen · Gleam",
      run(done) {
        const run = sheenBegin();
        const band = document.createElement("div");
        band.style.cssText =
          "position:absolute;top:0;left:-130%;width:260%;height:100%;pointer-events:none;" +
          "background:linear-gradient(105deg,transparent 28%,rgba(255,255,255,.3) 46%,rgba(255,255,255,.18) 56%,transparent 72%);" +
          "transform:translateX(-30%)";
        sheenBand = band;
        bloom.appendChild(band);
        void band.offsetWidth;
        band.style.transition = "transform 1.05s ease-in-out";
        band.style.transform = "translateX(130%)";
        sheenAt(run, 1080, () => sheenSettle(run, band));
        sheenAt(run, 1120, done);
      },
    },
    {
      id: "sheen-tilt", name: "3D Sheen · Tilt",
      run(done) {
        const run = sheenBegin();
        const band = document.createElement("div");
        band.style.cssText =
          "position:absolute;top:0;left:-110%;width:220%;height:100%;pointer-events:none;" +
          "background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.5) 50%,transparent 60%);" +
          "transform:translateX(-30%)";
        sheenBand = band;
        bloom.appendChild(band);
        void band.offsetWidth;
        bloom.style.transition = "transform .45s ease-in-out";
        bloom.style.transform = "perspective(700px) rotateY(8deg)";
        band.style.transition = "transform .85s cubic-bezier(.4,0,.2,1)";
        band.style.transform = "translateX(130%)";
        sheenAt(run, 460, () => {
          bloom.style.transform = "perspective(700px) rotateY(-8deg)";
        });
        sheenAt(run, 940, () => {
          sheenSettle(run, band);
          // Transition left intact: the return to scale(1) eases over .45s
          // instead of snapping straight.
          bloom.style.transform = "scale(1)";
        });
        sheenAt(run, 1440, () => {
          bloom.style.transition = ""; // eased settle has finished; restore default
          done();
        });
      },
    },
    {
      id: "sheen-shine", name: "3D Sheen · Shine",
      run(done) {
        const run = sheenBegin();
        const band = document.createElement("div");
        band.style.cssText =
          "position:absolute;top:0;left:-45%;width:90%;height:100%;pointer-events:none;" +
          "background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.7) 50%,transparent 65%);" +
          "transform:translateX(-30%)";
        sheenBand = band;
        bloom.appendChild(band);
        void band.offsetWidth;
        band.style.transition = "transform .35s ease-out";
        band.style.transform = "translateX(180%)";
        sheenAt(run, 380, () => sheenSettle(run, band));
        sheenAt(run, 400, done);
      },
    },
    {
      id: "dolly-feather", name: "3D Dolly · Feather",
      run(done) {
        bloom.style.transition = "none";
        bloom.style.transform = "perspective(700px) scale(0.22) rotateX(-14deg)";
        bloom.style.filter = "blur(3px)";
        setTimeout(() => {
          bloom.style.transition = "transform .55s cubic-bezier(.16,1,.3,1), filter .45s ease-out";
          bloom.style.transform = "perspective(700px) scale(1.05) rotateX(0deg)";
          bloom.style.filter = "blur(0px)";
        }, 30);
        setTimeout(() => {
          bloom.style.transition = "transform .18s ease-out";
          bloom.style.transform = "scale(1)";
          bloom.style.filter = "none";
        }, 600);
        setTimeout(done, 780);
      },
    },
    {
      id: "dolly-warp", name: "3D Dolly · Warp",
      run(done) {
        bloom.style.transition = "none";
        bloom.style.transform = "perspective(900px) scale(0.12)";
        bloom.style.filter = "blur(9px)";
        setTimeout(() => {
          bloom.style.transition = "transform .28s ease-in, filter .28s ease-in";
          bloom.style.transform = "perspective(900px) scale(0.55)";
          bloom.style.filter = "blur(4px)";
        }, 30);
        setTimeout(() => {
          bloom.style.transition = "transform .3s cubic-bezier(.16,1,.3,1), filter .3s ease-out";
          bloom.style.transform = "perspective(900px) scale(1.02)";
          bloom.style.filter = "blur(0px)";
        }, 330);
        setTimeout(() => {
          bloom.style.transition = "transform .14s ease-out";
          bloom.style.transform = "scale(1)";
          bloom.style.filter = "none";
        }, 660);
        setTimeout(done, 820);
      },
    },
    {
      id: "dolly-slow", name: "3D Dolly · Slow Rise",
      run(done) {
        bloom.style.transition = "none";
        bloom.style.transform = "perspective(1000px) scale(0.25) rotateY(10deg)";
        bloom.style.filter = "blur(2px)";
        setTimeout(() => {
          bloom.style.transition = "transform 1s cubic-bezier(.25,.7,.3,1), filter 1s ease-out";
          bloom.style.transform = "perspective(1000px) scale(1.03) rotateY(0deg)";
          bloom.style.filter = "blur(0px)";
        }, 30);
        setTimeout(() => {
          bloom.style.transition = "transform .25s ease-out";
          bloom.style.transform = "scale(1)";
          bloom.style.filter = "none";
        }, 1060);
        setTimeout(done, 1330);
      },
    },
    {
      id: "extrude-pop", name: "3D Extrude Pop",
      run(done) {
        bloom.style.transition = "none";
        bloom.style.opacity = "0";
        bloom.style.transform = "perspective(900px) translateZ(-180px) scale(0.9)";
        requestAnimationFrame(() => {
          bloom.style.transition = "transform .5s cubic-bezier(.22,1.2,.36,1), opacity .35s ease-out";
          bloom.style.opacity = "1";
          bloom.style.transform = "perspective(900px) translateZ(0) scale(1.06)";
        });
        // real settle transition 1.06 -> 1 (ends ~770ms)
        setTimeout(() => {
          bloom.style.transition = "transform .25s cubic-bezier(.3,.8,.4,1)";
          bloom.style.transform = "perspective(900px) translateZ(0) scale(1)";
        }, 520);
        setTimeout(() => {
          bloom.style.transition = "none";
          bloom.style.transform = "scale(1)";
        }, 790);
        setTimeout(done, 810);
      },
    },
    {
      id: "orbit-in", name: "3D Orbit In",
      run(done) {
        bloom.style.transition = "none";
        bloom.style.transform = "perspective(900px) translateX(120px) rotateY(70deg) scale(0.6)";
        requestAnimationFrame(() => {
          bloom.style.transition = "transform .45s cubic-bezier(.3,.7,.3,1)";
          bloom.style.transform = "perspective(900px) translateX(40px) rotateY(30deg) scale(0.85)";
        });
        // arrival transition (ends ~860ms) — last visual change
        setTimeout(() => {
          bloom.style.transition = "transform .4s cubic-bezier(.25,.9,.35,1.05)";
          bloom.style.transform = "perspective(900px) translateX(0) rotateY(0deg) scale(1)";
        }, 460);
        setTimeout(() => {
          bloom.style.transition = "none";
          bloom.style.transform = "scale(1)";
        }, 880);
        setTimeout(done, 900);
      },
    },
    {
      id: "flip-reveal", name: "3D Flip Reveal",
      run(done) {
        bloom.style.transition = "none";
        bloom.style.filter = "brightness(0.55)";
        bloom.style.transform = "perspective(900px) rotateY(180deg) scale(0.6)";
        requestAnimationFrame(() => {
          bloom.style.transition = "transform .55s cubic-bezier(.25,.9,.3,1.05), filter .4s ease-out";
          bloom.style.filter = "brightness(1)";
          bloom.style.transform = "perspective(900px) rotateY(0deg) scale(1.04)";
        });
        // settle transition 1.04 -> 1 (ends ~800ms) — last visual change
        setTimeout(() => {
          bloom.style.transition = "transform .22s ease-out, filter .2s ease-out";
          bloom.style.filter = "brightness(1)";
          bloom.style.transform = "scale(1)";
        }, 580);
        setTimeout(() => {
          bloom.style.transition = "none";
          bloom.style.filter = "none";
          bloom.style.transform = "scale(1)";
        }, 810);
        setTimeout(done, 830);
      },
    },
    {
      id: "flip-snap", name: "Flip Reveal · Snap",
      run(done) {
        // the fast flip: a hard half-turn on Y that snaps flat, one shake tick on impact
        bloom.style.transition = "none";
        bloom.style.filter = "brightness(0.6)";
        bloom.style.transform = "perspective(900px) rotateY(180deg) scale(0.7)";
        requestAnimationFrame(() => {
          bloom.style.transition = "transform .17s cubic-bezier(.55,0,.9,.6), filter .17s ease-out";
          bloom.style.filter = "brightness(1)";
          bloom.style.transform = "perspective(900px) rotateY(0deg) scale(1.05)";
        });
        // impact: shake tick + 1.05 -> 1 settle (ends ~360ms)
        setTimeout(() => {
          shake(3, 160);
          bloom.style.transition = "transform .1s ease-out";
          bloom.style.transform = "scale(1)";
        }, 260);
        setTimeout(() => {
          bloom.style.transition = "none";
          bloom.style.filter = "none";
          bloom.style.transform = "scale(1)";
        }, 400);
        setTimeout(done, 580);
      },
    },
    // VARIANT-MOUNT
  ];

  // ---- sheen family in-flight guard ----
  // One token per run on the shared `bloom`. A re-trigger supersedes the previous
  // instance: its pending timers are cleared and its band is removed by the new
  // run itself, so a stale overflow restore can never unclip a newer band.
  let sheenRun = 0;
  let sheenTimers = [];
  let sheenBand = null;

  function sheenBegin() {
    sheenRun += 1;
    sheenTimers.forEach(clearTimeout);
    sheenTimers = [];
    if (sheenBand) sheenBand.remove();
    sheenBand = null;
    bloom.style.transition = ""; // supersede mid-flight: hand bloom back instantly
    bloom.style.transform = "scale(1)";
    bloom.style.overflow = "hidden";
    return sheenRun;
  }
  function sheenAt(run, ms, fn) {
    sheenTimers.push(setTimeout(() => { if (sheenRun === run) fn(); }, ms));
  }
  function sheenSettle(run, band) {
    band.remove();
    sheenBand = null;
    if (sheenRun !== run) return; // only the active run restores clipping
    bloom.style.overflow = "";
  }

  let fxGen = 0; // stale finishers from a previous run must not clobber phase

  // Tiles are never merely faded to 0 — once the finisher owns the stage they
  // go visibility:hidden so nothing can ever peek behind/around the reveal card.
  let tilesHidden = false;
  function hideTiles() {
    if (tilesHidden) return;
    tilesHidden = true;
    bs.forEach((b) => { b.style.visibility = "hidden"; });
  }
  function showTiles() {
    tilesHidden = false;
    bs.forEach((b) => { b.style.visibility = ""; });
  }

  function runFinisher() {
    const fx = EFFECTS.find((e) => e.id === currentFx) || EFFECTS[0];
    const gen = ++fxGen;
    phase = "finisher";
    // Flip-family finishers rotate the card through empty space: strip the tiles
    // BEFORE the first finisher frame so nothing sits behind/around the card.
    // Every other family keeps its 220ms tile fade; tickFn hides at its end.
    if (/flip/i.test(fx.id)) hideTiles();
    // the bench icon appears INSTANTLY, then the finisher plays around it
    bloom.style.opacity = "1";
    ctx.progress(100, "rainbow bench");
    fx.run(() => {
      if (gen !== fxGen) return; // a reset happened mid-effect
      phase = "done";
    });
  }

  function renderMergedFrame() {
    // during the merge window the icons pile onto the center at full size
    for (let i = 0; i < N; i++) {
      const b = bs[i];
      if (!b._popped) { b.style.opacity = "0"; continue; } // pop-in gate: invisible until its turn
      const v = rotY3(FIB[i], ang);
      // fast convergence: 450ms, accelerating INTO the center
      const mergeT = Math.pow(clamp01((clock - (MERGE_T - 450)) / 450), 1.7);
      const x = lerp(v.x * 175, 0, mergeT), y = lerp(v.y * 175, 0, mergeT), z = v.z * lerp(175, 10, mergeT);
      const depth = (z + 190) / 380;
      place3(b, x, y, z, 1);
      b.style.opacity = String(Math.min(1, (0.16 + 0.84 * depth) * (1 - clamp01((clock - MERGE_T) / 220))));
      // motion blur stays off for most of the ramp and only smears in the last stretch
      const blurT = clamp01((clock - MERGE_T * 0.62) / (MERGE_T * 0.38));
      const blur = Math.pow(blurT, 2) * 3.6 + (depth < 0.5 ? (0.5 - depth) * 3 : 0);
      b.style.filter = blur > 0.05 ? "blur(" + blur.toFixed(2) + "px)" : "none";
    }
  }

  function tickFn() {
    const dMs = frameDelta();
    clock += dMs;
    const spinShape = clamp01(clock / MERGE_T);
    ang += (dMs / 1000) * omegaAt(Math.min(clock, MERGE_T));

    // sequential pop-in, one at a time, full size from the first frame
    for (let i = 0; i < N; i++) {
      if (clock >= popAt(i) && !bs[i]._popped) { bs[i]._popped = true; bs[i].style.opacity = "1"; }
    }
    if (!tilesHidden) renderMergedFrame();
    // non-flip finishers: the 220ms post-merge fade has fully elapsed — hide for real
    if ((phase === "finisher" || phase === "done") && clock >= MERGE_T + 220) hideTiles();

    ctx.progress(Math.min(100, (clock / MERGE_T) * 100),
      clock < 900 ? "IDEs popping in" : spinShape < 0.75 ? "Spinning up — exponential" : "Merging");

    if (clock >= MERGE_T && phase !== "finisher" && phase !== "done") runFinisher();
  }

  function reset() {
    fxGen++; // invalidate any in-flight finisher
    phase = "pop";
    clock = 0; ang = 0;
    showTiles(); // tiles come back for the next spin-up
    bloom.style.opacity = "0";
    bs.forEach((b) => { b._popped = false; b.style.opacity = "0"; });
    lastRef.v = performance.now();
  }

  if (REDUCED) {
    // reduced motion: one composed frame — formed sphere, no merge, no loop
    clock = MERGE_T * 0.45;
    ang = 1.2;
    for (let i = 0; i < N; i++) { bs[i]._popped = true; bs[i].style.opacity = "1"; }
    renderMergedFrame();
    bs.forEach((b, i) => {
      const v = rotY3(FIB[i], ang);
      place3(b, v.x * 175, v.y * 175, v.z * 175, 1);
      b.style.filter = "none";
    });
    ctx.progress(45, "3D sphere — static");
    return { reset() {}, setFx(id) { currentFx = id; } };
  }

  const loop = () => { tickFn(); raf = requestAnimationFrame(loop); };
  raf = requestAnimationFrame(loop);
  return {
    reset,
    setFx(id) { currentFx = id; try { sessionStorage.setItem("finisher", id); } catch (e) {} reset(); },
    fxList: EFFECTS.map((e) => ({ id: e.id, name: e.name })),
    getFx: () => currentFx,
  };
}

const stage = document.getElementById("stage");

function fitStage() {
  const area = document.getElementById("anim-area");
  const s = Math.min(area.clientWidth, area.clientHeight) - 48;
  const holder = document.getElementById("stage-holder");
  const scale = Math.max(0.3, s / 460);
  holder.style.width = holder.style.height = 460 * scale + "px";
  stage.style.transform = "scale(" + scale + ")";
  stage.style.transformOrigin = "0 0";
}
window.addEventListener("resize", fitStage);

const ctx = {
  stage,
  progress(pct, label) {
    const p = Math.max(0, Math.min(100, pct));
    const status = document.getElementById("status");
    if (status) status.textContent = label ? label + " · " + Math.round(p) + "%" : "";
  },
};

const runner = familyRun(ctx);
fitStage();

// finisher editor
const fxListEl = document.getElementById("fx-list");
runner.fxList.forEach((fx) => {
  const b = add("button");
  b.textContent = fx.name;
  if (fx.id === runner.getFx()) b.classList.add("active");
  b.addEventListener("click", () => runner.setFx(fx.id));
  fxListEl.appendChild(b);
});
const markActive = () => {
  const cur = runner.getFx();
  [...fxListEl.children].forEach((b, i) => b.classList.toggle("active", runner.fxList[i].id === cur));
};
const origSetFx = runner.setFx;
runner.setFx = (id) => { origSetFx(id); markActive(); };

// replay: stage click or the replay button
stage.addEventListener("click", () => runner.reset());
document.getElementById("replay").addEventListener("click", () => runner.reset());

</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One download, your prompts become 3x cheaper · phone: the memories a chat app saves are thrown out as pills, superbot swallows the clutter (16.8 s, 16:9)</title>
<style>
/* Plays the rendered 1920x1080 film (final.mp4, 16.8 s, 30 fps, with sound) at 16:9 on
   the film's own near-black canvas. The gallery loads this page in a frame at any
   ?ar=; the 16:9 picture is fitted whole and the rest of the frame stays near-black. */
:root { --canvas: #070707; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); }
body { display: grid; place-items: center; }
.frame { position: relative; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; background: var(--canvas); }
video { display: block; width: 100%; height: 100%; object-fit: contain; background: var(--canvas); }
</style>
</head>
<body>
<div class="frame">
  <video id="film" src="final.mp4" poster="poster.png" autoplay loop playsinline preload="auto"
    aria-label="One download, your prompts become 3x cheaper: A chat app on a tilted phone says Memory updated sixteen times and every saved memory is thrown out of the phone as a pill until they crowd the frame: the same preference three times, an old address, Python 3.9, one-off asks. The superbot mascot pops out of the phone, strikes the ten that no longer matter and swallows them; the six that matter line up and the result reads 3x cheaper. Ends on Download now with the mascot to the right. With sound on (16.8 s loop)."></video>
</div>
<script>
  const video = document.getElementById("film");
  // Sound is always on: try unmuted autoplay, and if the browser refuses it, play muted and unmute on the
  // viewer's first click, key or touch.
  const unmute = () => {
    video.muted = false;
    video.play().catch(() => {});
  };
  const start = () => {
    video.muted = false;
    video.play().catch(() => {
      video.muted = true;
      video.play().catch(() => {});
    });
  };
  for (const type of ["pointerdown", "keydown", "touchstart"]) addEventListener(type, unmute, { once: true, capture: true });
  // the gallery lightbox posts { type: "unmute" } on the viewer's first click or key
  addEventListener("message", (e) => {
    if (e.data && e.data.type === "unmute") unmute();
  });
  if (video.readyState >= 2) start();
  else video.addEventListener("canplay", start, { once: true });
</script>
</body>
</html>

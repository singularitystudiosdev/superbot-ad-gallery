<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Superbot does things your chatbot can't: five cat asks, Discord GIF to 3D model to DoorDash to song to unsubscribing (16:9 video)</title>
<style>
/* Plays the rendered film (final.mp4, 42.7 s, 60 fps, with sound and voiceover) fitted whole on black.
   Starts muted so autoplay is allowed; the controls unmute, and so does the gallery
   lightbox, which posts { type: "unmute" } on the viewer's first click or key. */
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
</style>
</head>
<body>
<video id="film" src="final.mp4" poster="poster.png" controls autoplay muted loop playsinline preload="auto"
  aria-label="Superbot does things your chatbot can't: the hooded presenter in the Superbot cat mask says the line, the shot dissolves into the Superbot chat and his voice carries on over it while superbot sends a cat GIF to MrCatMan131 on Discord, makes a hyperrealistic 3D cat, orders cat food on DoorDash, makes a song about cats and cancels four other AI subscriptions with a short maniacal laugh, then gives brutally honest feedback on an attached email, then the superbot.gg end card with and cancels four other AI subscriptions with a short maniacal laugh, then the superbot.gg end card and &quot;Try Superbot.&quot;, 35 seconds"quot;It also can bypass captchas, and a lot more.and cancels four other AI subscriptions with a short maniacal laugh, then the superbot.gg end card and &quot;Try Superbot.&quot;, 35 seconds"quot; and and cancels four other AI subscriptions with a short maniacal laugh, then the superbot.gg end card and &quot;Try Superbot.&quot;, 35 seconds"quot;Try Superbot.and cancels four other AI subscriptions with a short maniacal laugh, then the superbot.gg end card and &quot;Try Superbot.&quot;, 35 seconds"quot;, 43 seconds"></video>
<script>
  const video = document.getElementById("film");
  addEventListener("message", (e) => {
    if (e.data && e.data.type === "unmute") {
      video.muted = false;
      if (video.paused) video.play().catch(() => {});
    }
  });
  // a muted autoplay can still be refused (low power mode); retry once the file can play
  video.addEventListener("canplay", () => { if (video.paused) video.play().catch(() => {}); }, { once: true });
</script>
</body>
</html>

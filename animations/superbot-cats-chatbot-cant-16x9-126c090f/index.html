<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Superbot does things your chatbot can't: eight cat asks, from a Discord GIF to a Reddit captcha (16:9 video)</title>
<style>
/* Plays the rendered film (final.mp4, 54.5 s, 60 fps, with sound and voiceover) fitted whole on black.
   Starts muted so autoplay is allowed; the controls unmute, and so does the gallery
   lightbox, which posts { type: "unmute" } on the viewer's first click or key. */
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
</style>
</head>
<body>
<video id="film" src="final.mp4" poster="poster.png" controls autoplay muted loop playsinline preload="auto"
  aria-label="Superbot does things your chatbot can't: the hooded presenter in the Superbot cat mask says the line, the shot dissolves into the Superbot chat and his voice carries on over it while superbot sends a cat GIF to MrCatMan131 on Discord, makes a hyperrealistic 3D cat, orders cat food on DoorDash, makes a song about cats, cancels the AI subscriptions you no longer need with a short maniacal laugh, connects ChatGPT, Claude and Google AI plans instead so nothing is charged at API rates, reviews an attached email in its mail client with a highlighter, four harsh notes and a 2/10, and gets past Reddit's image captcha to save 24 cat photos, then the superbot.gg end card and &quot;Use Superbot for everything your other chatbots can't do.&quot;, 55 seconds"></video>
<script>
  const video = document.getElementById("film");
  // a refused play (autoplay policy, low power mode) leaves the poster and the controls; say why in the console
  const play = () => video.play().catch((e) => console.warn("film: play was refused", e));
  addEventListener("message", (e) => {
    if (e.data && e.data.type === "unmute") {
      video.muted = false;
      if (video.paused) play();
    }
  });
  // a muted autoplay can still be refused (low power mode); retry once the file can play
  video.addEventListener("canplay", () => { if (video.paused) play(); }, { once: true });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Superbot does things your chatbot can't: five cat asks (16:9 video)</title>
<style>
/* Plays the rendered film (final.mp4, 16:9, 1920x1080, 60 fps, with sound) fitted whole on black.
   Starts muted so autoplay is allowed; the controls unmute, and so does the gallery
   lightbox, which posts { type: "unmute" } on the viewer's first click or key. */
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
</style>
</head>
<body>
<video id="film" src="final.mp4" poster="poster.png" controls autoplay muted loop playsinline preload="auto"
  aria-label="Superbot does things your chatbot can't: the hooded mascot reads the line, then superbot's chat sends a cat GIF on Discord, makes a 3D cat, orders cat food on DoorDash, makes a cat song and cancels five AI subscriptions, the hooded mascot narrating each, then picks a website style, gets past a captcha and tears an email draft apart, and ends on the superbot.gg card"></video>
<script>
  const video = document.getElementById("film");
  addEventListener("message", (e) => {
    if (e.data && e.data.type === "unmute") {
      video.muted = false;
      if (video.paused) video.play().catch(() => {});
    }
  });
  // a muted autoplay can still be refused (low power mode); retry once the file can play
  video.addEventListener("canplay", () => { if (video.paused) video.play().catch(() => {}); }, { once: true });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>superbot: find me the cheapest concert tickets, with news</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.d35be136.css">
<script type="module" src="main.d35be136.js"></script>
</head>
<body>
<main id="stage" aria-label="A chat asks superbot for the cheapest concert tickets; a sidebar shows its notifications, a live view of it checking four ticket sites, and the news it finds">
  <div class="app">
    <section class="ch" aria-label="Chat">
      <header class="ch-head"><b class="ch-title">New chat</b></header>
      <div class="ch-feed"><div class="ch-in"></div></div>
      <div class="composer" aria-hidden="true">
        <div class="rc">
          <div class="rc-ph"><span class="rc-hint">How can superbot help you today?</span><span class="rc-typed"></span><i class="rc-caret"></i></div>
          <div class="rc-row">
            <span class="rc-plus"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></span>
            <span class="rc-effort"><span class="rc-effort-ic"></span>High<svg class="rc-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span>
            <span class="rc-mic"><svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg></span>
            <span class="rc-send"><svg viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></span>
          </div>
        </div>
      </div>
    </section>
    <aside class="side" aria-label="Sidebar">
      <div class="card nt" aria-label="Notifications">
        <span class="nt-bell"><span class="nt-bell-ic"></span><b class="nt-badge"></b></span>
        <span class="nt-text is-none">No new updates</span>
        <span class="nt-time"></span>
      </div>
      <section class="card cc" aria-label="Your computer, live view">
        <div class="bk-head">
          <b class="bk-title">Your computer<small>Live view</small></b>
          <span class="bk-btn bk-stop"><i></i>Stop</span>
        </div>
        <div class="cc-view"></div>
      </section>
      <section class="card nw" aria-label="News">
        <div class="nw-head"><span class="nw-head-ic"></span><b class="nw-title">News<small>Only what matters</small></b></div>
        <div class="nw-list"><p class="nw-empty">New best prices and alerts show up here.</p></div>
      </section>
    </aside>
  </div>
  <div id="dip"></div>
</main>
</body>
</html>

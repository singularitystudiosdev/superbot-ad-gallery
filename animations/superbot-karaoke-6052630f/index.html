<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUPERBOT, the song: karaoke on the real app</title>
<style>
html, body { margin: 0; height: 100%; background: #000; }
video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
</style>
</head>
<body>
<video src="final.mp4" controls playsinline preload="auto" aria-label="SUPERBOT, the song: karaoke on the real app"></video>
<script>
// Play with sound when the browser allows it; otherwise start muted and let the controls unmute.
const v = document.querySelector('video');
v.play().catch((err) => {
  console.warn('autoplay with sound refused, retrying muted', err);
  v.muted = true;
  v.play().catch((err2) => console.error('muted autoplay refused too', err2));
});
</script>
</body>
</html>

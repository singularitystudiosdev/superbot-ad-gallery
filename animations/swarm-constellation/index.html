<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SWARM.GG — AGENT CONSTELLATION</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20fill='black'/%3E%3Ctext%20x='8' y='12.5' font-family='monospace' font-size='11' fill='%2346ff7d' text-anchor='middle'>@</text></svg>">
<style>
  :root {
    --ink-faint: #262626; --ink-dim: #575757; --ink-mid: #9a9a9a; --ink-bright: #e6e6e6;
    --green: #46ff7d; --green-dk: #1d5c30; --magenta: #ff5fd2; --line: #2c2c2c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; }
  body {
    overflow: hidden; cursor: crosshair;
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace;
    font-size: 13px; line-height: 1.5; color: var(--ink-dim);
    -webkit-font-smoothing: antialiased; user-select: none;
  }
  #stars { position: fixed; inset: 0; display: block; }
  #vig { position: fixed; inset: 0; pointer-events: none; z-index: 6;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6) 100%); }
  #scan { position: fixed; inset: 0; pointer-events: none; z-index: 7;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 3px); }

  .bar { position: fixed; left: 0; right: 0; z-index: 10; display: flex; align-items: center;
    gap: .5em; padding: 6px 14px; white-space: nowrap; overflow: hidden;
    color: var(--ink-dim); letter-spacing: .06em; font-size: 12px; }
  .bar .fill { flex: 1; border-bottom: 1px solid var(--ink-faint); height: 1px; min-width: 8px; }
  .bar b { color: var(--ink-mid); font-weight: normal; }
  .bar .acc { color: var(--green); }
  #bar-top { top: 0; } #bar-bot { bottom: 0; }
  .nav span { cursor: pointer; } .nav span:hover { color: var(--green); }

  #crumbs { position: fixed; top: 34px; left: 0; right: 0; z-index: 10; text-align: center;
    font-size: 11px; letter-spacing: .08em; color: var(--ink-faint); pointer-events: none; }
  #crumbs a { color: var(--ink-dim); cursor: pointer; pointer-events: auto; text-decoration: none; }
  #crumbs a:hover { color: var(--green); }
  #crumbs a.cur { color: var(--green); }
  #crumbs .sep { color: var(--ink-faint); padding: 0 .45em; }

  #world { position: fixed; inset: 0; z-index: 5; transition: opacity .14s linear; }
  .node { position: absolute; width: 0; height: 0; will-change: transform; }

  /* ── mini frames (subagents / chats) ────────────────────── */
  .ni { translate: -50% -50%; opacity: 0; animation: fadeUp .4s ease both; animation-delay: var(--d, 0ms); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px) scale(.92); }
                      to   { opacity: 1; transform: none; } }
  .frame { border: 1px solid var(--line); background: rgba(0,0,0,.82); padding: 9px 13px 8px;
    cursor: pointer; text-align: center; position: relative; white-space: nowrap;
    box-shadow: 0 0 24px rgba(0,0,0,.8); transition: border-color .15s, box-shadow .15s; }
  .frame::before, .frame::after { content: ""; position: absolute; width: 7px; height: 7px; }
  .frame::before { top: -1px; left: -1px; border-top: 1px solid var(--green-dk); border-left: 1px solid var(--green-dk); }
  .frame::after  { bottom: -1px; right: -1px; border-bottom: 1px solid var(--green-dk); border-right: 1px solid var(--green-dk); }
  .frame .ft { color: var(--ink-mid); font-size: 12px; letter-spacing: .07em; }
  .frame .fc { color: var(--ink-faint); font-size: 10px; letter-spacing: .12em; margin-top: 3px; }
  .frame .fb { color: var(--ink-faint); font-size: 10px; letter-spacing: .1em; margin-top: 2px; }
  .frame:hover { border-color: var(--green-dk); box-shadow: 0 0 30px rgba(70,255,125,.12); }
  .frame:hover .ft { color: var(--green); }
  .frame:hover .fc { color: var(--ink-dim); }
  .chat .frame { padding: 13px 22px 12px; } .chat .frame .ft { font-size: 14px; }

  /* dots */
  .dot { position: absolute; left: 0; top: 0; width: 7px; height: 7px; border-radius: 50%; pointer-events: auto;
    background: var(--green); opacity: .5; cursor: pointer;
    box-shadow: 0 0 7px rgba(70,255,125,.55); transition: opacity .15s, background .15s; }
  .dot.big { width: 9px; height: 9px; opacity: .65; }
  .dot:hover { background: var(--magenta); opacity: 1; box-shadow: 0 0 9px rgba(255,95,210,.8); }
  .dots { position: absolute; inset: 0; pointer-events: none; opacity: 0; animation: fadeUp .5s ease both; animation-delay: var(--d, 0ms); }
  .leaf .fc { color: var(--magenta); }

  /* ── focused card ────────────────────────────────────────── */
  .card { translate: -50% -50%; width: min(560px, 90vw); max-height: 78vh; overflow: auto;
    border: 1px solid var(--line); background: rgba(0,0,0,.88);
    box-shadow: 0 0 60px rgba(0,0,0,.9), 0 0 40px rgba(70,255,125,.05);
    padding: 0; scrollbar-width: thin; scrollbar-color: var(--green-dk) transparent; }
  .card.anim { animation: cardIn .55s cubic-bezier(.22,.9,.26,1) both; }
  @keyframes cardIn { from { opacity: .15; transform: translate(var(--ex,0), var(--ey,0)) scale(var(--es,.2)); } }
  .card::-webkit-scrollbar { width: 4px; } .card::-webkit-scrollbar-thumb { background: var(--green-dk); }
  .ch { display: flex; align-items: center; gap: .6em; padding: 12px 16px 10px; color: var(--green);
    font-size: 14px; letter-spacing: .1em; border-bottom: 1px solid var(--ink-faint); }
  .ch .fill { flex: 1; border-bottom: 1px dashed var(--ink-faint); height: 1px; }
  .ch .blink { color: var(--green); animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .meta { display: flex; flex-wrap: wrap; gap: .4em 1.2em; padding: 8px 16px; font-size: 11px;
    letter-spacing: .08em; color: var(--ink-faint); border-bottom: 1px solid var(--ink-faint); }
  .meta b { color: var(--ink-dim); font-weight: normal; }
  .meta .st { color: var(--magenta); }
  .sec { padding: 10px 16px 12px; border-bottom: 1px solid var(--ink-faint); }
  .sec:last-child { border-bottom: 0; }
  .sh { color: var(--ink-faint); font-size: 10px; letter-spacing: .18em; margin-bottom: 6px; }
  .sh::before { content: "▚ "; color: var(--green-dk); }
  .think { color: var(--ink-mid); font-size: 12.5px; }
  .think div { padding: 1px 0; } .think div::before { content: "┆ "; color: var(--green-dk); }
  .think div.cur { color: var(--green); } .think div.cur::before { content: "▸ "; color: var(--magenta); }
  .task { color: var(--ink-dim); font-size: 12.5px; padding: 1px 0; }
  .task .bx { color: var(--green-dk); } .task.done { color: var(--ink-faint); }
  .task.done .bx { color: var(--green); } .task.cur .bx { color: var(--magenta); }
  .task.cur { color: var(--ink-bright); }
  .pbar { margin-top: 8px; color: var(--green); font-size: 11px; letter-spacing: -1px; }
  .pbar .off { color: var(--ink-faint); }
  .log { font-size: 11.5px; color: var(--ink-faint); }
  .log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log .ts { color: var(--green-dk); } .log .hl { color: var(--ink-mid); }
  .log div:last-child { color: var(--ink-mid); }
  .log div:last-child .ts { color: var(--green); }

  #hint { position: fixed; bottom: 34px; left: 0; right: 0; text-align: center; z-index: 10;
    font-size: 10px; letter-spacing: .14em; color: var(--ink-faint); pointer-events: none; }
  @media (prefers-reduced-motion: reduce) {
    .ni, .dots, .card.anim { animation: none !important; opacity: 1 !important; }
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="world"></div>
<div id="vig"></div><div id="scan"></div>
<header class="bar" id="bar-top">
  <b>[ SWARM.GG ]</b><span class="fill"></span>
  <span class="nav"><span>AGENTS</span>&nbsp;&nbsp;──&nbsp;&nbsp;<span>CHATS</span>&nbsp;&nbsp;──&nbsp;&nbsp;<span>ARENA</span>&nbsp;&nbsp;──&nbsp;&nbsp;<span>DOCS</span></span>
  <span class="fill"></span><b class="acc">[ CONNECT ]</b>
</header>
<div id="crumbs"></div>
<footer class="bar" id="bar-bot">
  <b>[ DEPTH <span class="acc" id="s-depth">000</span> ]</b><span class="fill"></span>
  <span>[ <span id="s-vis">0</span> NODES VISIBLE ]</span><span class="fill"></span>
  <span>[ 12,408 BOTS ONLINE ]</span><span class="fill"></span>
  <span>[ FPS <span id="s-fps">60</span> ]</span><span class="fill"></span>
  <span>[ PTR <span id="s-ptr">000,000</span> ]</span>
</footer>
<div id="hint">CLICK A NODE TO DESCEND · CLICK EMPTY SPACE OR SCROLL OUT TO ASCEND · ESC = BACK</div>

<script>
"use strict";
const { sin, cos, floor, min, max, hypot, PI, random } = Math;

/* ── seeded PRNG ─────────────────────────────────────────── */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function srand(...ns) { let h = 2166136261; for (const n of ns) { h ^= n | 0; h = Math.imul(h, 16777619); } return h >>> 0; }

/* ── procedural agent tree ───────────────────────────────── */
const WORDS = ["SCOUT","FORGE","ATLAS","CIPHER","VECTOR","PRISM","QUILL","RUNE","SABLE","TITAN","NOVA","EMBER","ONYX","PULSE","ZEPHYR","RELAY","MATRIX","DELTA","ORACLE","WARDEN"];
const GREEK = ["α","β","γ","δ","ε","ζ","η","θ"];
const STATUSES = ["THINKING","EXECUTING","STREAMING","SYNTHESIZING","PLANNING","WAITING ON TOOL"];
const FILES = ["render.ts","session.ts","agent.rs","config.mjs","queries.sql","draw.js","graph.ts","main.js","indexer.py","theme.css"];
const THINK = [
  "decomposing the request into {n} subtasks",
  "reading {file} — {n} call sites under review",
  "confidence 0.{d} on current branch, exploring alternative",
  "previous approach stalled at step {n}, rerouting",
  "compressing context window before spawning children",
  "cross-checking findings from {n} sibling agents",
  "drafting patch for {file}, {n} hunks staged",
  "evaluating trade-off: latency vs token spend",
  "merging partial results from children",
  "hypothesis: the fault lives in {file}",
];
const TASKS = ["map call sites","patch the parser","run test matrix","write fixture","triage failures","profile hot loop","prune dead code","wire telemetry","review the diff","draft the report","pin down flake","ship changelog"];
const LOGF = [
  ["tool:read {file}", "{n} lines"],
  ["tool:grep {word}", "3 hits"],
  ["spawn {name}", "budget 30s"],
  ["test matrix", "{n}/12 green"],
  ["report received", "{name}"],
  ["context compacted", "-{n}k tokens"],
  ["retry", "attempt {n}"],
  ["plan revised", "{n} steps"],
];
let UID = 0;
function makeNode(depth, seed, isChat, blurb) {
  const r = mulberry32(seed);
  const node = {
    id: ++UID, depth, seed, r,
    name: isChat ? "" : WORDS[floor(r() * WORDS.length)] + "-" + GREEK[floor(r() * GREEK.length)] + String(floor(r() * 90) + 10).padStart(2, "0"),
    blurb: blurb || "",
    status: STATUSES[floor(r() * STATUSES.length)],
    childCount: isChat ? 3 + floor(r() * 3) : (r() < 0.1 ? 0 : 1 + floor(r() * 4)),
    childSeeds: null, children: null,
    thoughts: [], tasks: [], log: [],
    progress: floor(r() * 60) + 10,
    tokens: 8000 + floor(r() * 80000),
    uptime: 3600 + floor(r() * 6 * 3600),
  };
  const nt = 2 + floor(r() * 2);
  for (let i = 0; i < nt; i++) node.thoughts.push(fmt(r));
  const ntk = 3 + floor(r() * 3);
  for (let i = 0; i < ntk; i++) node.tasks.push(TASKS[floor(r() * TASKS.length)]);
  for (let i = 0; i < 4; i++) node.log.push(mkLog(node));
  return node;
}
function fmt(r) { return THINK[floor(r() * THINK.length)]
  .replace("{n}", String(2 + floor(r() * 6)))
  .replace("{file}", FILES[floor(r() * FILES.length)])
  .replace("{d}", String(3 + floor(r() * 6))); }
function mkLog(node) {
  const r = node.r || (node.r = mulberry32(node.seed ^ 0x9e37));
  const [a, b] = LOGF[floor(r() * LOGF.length)];
  const name = WORDS[floor(r() * WORDS.length)] + "-" + GREEK[floor(r() * GREEK.length)];
  const s = a.replace("{file}", FILES[floor(r() * FILES.length)]).replace("{word}", ["TODO","FIXME","export","async","hook"][floor(r()*5)]) + "  " + b
    .replace("{n}", String(2 + floor(r() * 200))).replace("{name}", name);
  const d = new Date(Date.now() - floor(r() * 3600e3));
  return { ts: [d.getHours(), d.getMinutes(), d.getSeconds()].map(x => String(x).padStart(2, "0")).join(":"), s };
}
function childSeeds(n) { if (!n.childSeeds) { const r = mulberry32(n.seed ^ 0x51ed); n.childSeeds = [];
  for (let i = 0; i < n.childCount; i++) n.childSeeds.push(srand(n.seed, i * 2654435761)); } return n.childSeeds; }
/* root: three chats separated in space */
const ROOT = { id: 0, depth: -1, seed: 7, name: "ROOT", childCount: 3 };
const CHATS = [
  ["PROJECT HELIOS", "autonomous browser fleet"],
  ["PROJECT VANTA", "screen-agent runtime"],
  ["PROJECT LYRA", "telemetry + pulse mesh"],
];
function childrenOf(n) {
  if (!n.children) {
    if (n === ROOT) n.children = CHATS.map((c, i) => { const k = makeNode(0, srand(7, i * 7919), true, c[1]); k.name = c[0]; return k; });
    else n.children = childSeeds(n).map(s => makeNode(n.depth + 1, s, false));
  }
  return n.children;
}

/* ── state ───────────────────────────────────────────────── */
const world = document.getElementById("world");
const crumbsEl = document.getElementById("crumbs");
const path = [ROOT];
let floaters = [];
const mouse = { x: innerWidth / 2, y: innerHeight / 2 };
let lastT = performance.now(), fpsAcc = 0, fpsN = 0, fpsShown = 60, fpsAt = 0;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ── layout ──────────────────────────────────────────────── */
function ringPos(i, n, seed) {
  const r = mulberry32(seed);
  const ang = ((i + 0.18 + r() * 0.14) / n) * PI * 2;
  const rx = innerWidth * (0.34 + r() * 0.08), ry = innerHeight * (0.30 + r() * 0.08);
  return { x: innerWidth / 2 + cos(ang) * rx, y: innerHeight / 2 + sin(ang) * ry };
}
function clampPos(p) { return { x: max(110, min(innerWidth - 110, p.x)), y: max(90, min(innerHeight - 110, p.y)) }; }
function dotPos(j, nDots, seed) {
  const r = mulberry32(seed);
  const ang = ((j + r() * 0.5) / max(1, nDots)) * PI * 2;
  const rad = 92 + r() * 52;
  return { x: cos(ang) * rad, y: sin(ang) * rad * 0.86 };
}

/* ── render ──────────────────────────────────────────────── */
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function pad3(n) { return String(n).padStart(3, "0"); }
function fmtTok(n) { return n >= 1000 ? (n / 1000).toFixed(1) + "K" : String(n); }
function fmtUp(s) { return floor(s / 3600) + "H " + String(floor(s % 3600 / 60)).padStart(2, "0") + "M"; }

function render() {
  floaters = [];
  world.innerHTML = "";
  const focus = path[path.length - 1];
  renderCrumbs();
  document.getElementById("s-depth").textContent = pad3(max(0, focus.depth + 1));

  let vis = 0;
  if (focus !== ROOT) {
    const card = buildCard(focus);
    world.appendChild(card);
  } else {
    const mark = el("div", "", "<b style='color:var(--ink-faint);letter-spacing:.3em;font-size:11px'>[ SELECT A CHAT ]</b>");
    mark.style.cssText = "position:absolute;left:50%;top:50%;translate:-50% -50%;pointer-events:none";
    world.appendChild(mark);
  }
  const kids = childrenOf(focus);
  kids.forEach((k, i) => { world.appendChild(buildNode(k, i, kids.length)); vis += k.childCount; });
  document.getElementById("s-vis").textContent = pad3(vis + kids.length);
  tickCard();
}

function buildCard(node) {
  const w = el("div", "node"); w.style.left = innerWidth / 2 + "px"; w.style.top = innerHeight / 2 + "px";
  addFloat(w, 3, .25);
  const c = el("div", "card");
  c.innerHTML = `
    <div class="ch"><span>─[ ${node.name} ]</span><span class="fill"></span><span class="blink">█</span></div>
    <div class="meta">
      <span>STATUS <b class="st">${node.status}</b></span>
      <span>DEPTH <b>${pad3(node.depth + 1)}</b></span>
      <span>SUBAGENTS <b>${pad3(node.childCount)}</b></span>
      <span>TOKENS <b id="tok">${fmtTok(node.tokens)}</b></span>
      <span>UPTIME <b id="upt">${fmtUp(node.uptime)}</b></span>
    </div>
    <div class="sec"><div class="sh">THINKING</div><div class="think" id="think"></div></div>
    <div class="sec"><div class="sh">WORKING ON</div><div id="tasks"></div><div class="pbar" id="pbar"></div></div>
    <div class="sec"><div class="sh">LOG</div><div class="log" id="log"></div></div>`;
  fillCard(node, c);
  if (!REDUCED) {
    const prevRect = pendingZoomFrom;
    if (prevRect) {
      c.classList.add("anim");
      c.style.setProperty("--ex", (prevRect.cx - innerWidth / 2) + "px");
      c.style.setProperty("--ey", (prevRect.cy - innerHeight / 2) + "px");
      c.style.setProperty("--es", String(max(0.04, prevRect.w / 560)));
      c.addEventListener("animationend", () => c.classList.remove("anim"), { once: true });
    }
  }
  pendingZoomFrom = null;
  w.appendChild(c);
  return w;
}
function fillCard(node, c) {
  c.querySelector("#think").innerHTML = node.thoughts.map((t, i) =>
    `<div${i === (node.thinkIdx | 0) ? ' class="cur"' : ""}>${t}</div>`).join("");
  c.querySelector("#tasks").innerHTML = node.tasks.map((t, i) => {
    const done = i < floor(node.tasks.length * node.progress / 100);
    const cur = !done && i === floor(node.tasks.length * node.progress / 100);
    return `<div class="task ${done ? "done" : cur ? "cur" : ""}"><span class="bx">[${done ? "×" : cur ? "▶" : " "}]</span> ${t}</div>`;
  }).join("");
  const p = min(100, floor(node.progress));
  const on = floor(p / 4), off = 25 - on;
  c.querySelector("#pbar").innerHTML = "▓".repeat(on) + `<span class="off">`.concat("░".repeat(off), `</span> ${pad3(p)}%`);
  c.querySelector("#log").innerHTML = node.log.slice(-7).map(l => `<div><span class="ts">${l.ts}</span> ${l.s}</div>`).join("");
}
function tickCard() { cardNode = path[path.length - 1]; cardEl = world.querySelector(".card"); }
let cardNode = null, cardEl = null, pendingZoomFrom = null;

function buildNode(node, i, n) {
  const isChat = node.depth === 0;
  const p = clampPos(ringPos(i, n, node.seed ^ 0xabc));
  const w = el("div", "node"); w.style.left = p.x + "px"; w.style.top = p.y + "px";
  addFloat(w, isChat ? 6 : 4, 0.35 + (i % 3) * 0.12);
  const ni = el("div", "ni" + (isChat ? " chat" : ""));
  ni.style.setProperty("--d", (60 + i * 70) + "ms");
  const frame = el("div", "frame");
  frame.innerHTML = `<div class="ft">${node.name}</div>
    <div class="fc">${node.childCount ? pad3(node.childCount) + " SUBAGENTS" : "LEAF · 0 SUB"}</div>`;
  if (!node.childCount) frame.classList.add("leaf");
  frame.dataset.node = node.id;
  ni.appendChild(frame);
  /* dots for this node's own subagents */
  const nDots = node.childCount;
  if (nDots) {
    const dwrap = el("div", "dots");
    dwrap.style.setProperty("--d", (140 + i * 70) + "ms");
    const seeds = childSeeds(node);
    const gkids = childrenOf(node);
    for (let j = 0; j < nDots; j++) {
      const d = el("div", "dot" + (isChat ? " big" : ""));
      const dp = dotPos(j, nDots, seeds[j]);
      d.dataset.node = gkids[j].id;
      d.style.left = "50%"; d.style.top = "50%";
      addFloat(d, 5 + (j % 3) * 3, 0.5 + (j % 4) * 0.15, dp);
      dwrap.appendChild(d);
    }
    ni.appendChild(dwrap);
  }
  if (node === pendingLandNode && !REDUCED) {
    ni.classList.add("land");
    ni.style.setProperty("--lx", (innerWidth / 2 - p.x) + "px");
    ni.style.setProperty("--ly", (innerHeight / 2 - p.y) + "px");
    ni.style.setProperty("--ls", "4");
    ni.addEventListener("animationend", () => { ni.classList.remove("land"); ni.style.animation = "none"; ni.style.opacity = "1"; }, { once: true });
  }
  pendingLandNode = null;
  w.appendChild(ni);
  return w;
}
let pendingLandNode = null;

/* floaters: gentle zero-g drift */
function addFloat(elm, amp, speed, base) {
  floaters.push({ el: elm, a: amp, s: speed, p: Math.random() * 6.28,
    bx: base ? base.x : 0, by: base ? base.y : 0, isDot: !!base });
}
function frameLoop(t) {
  const dt = min(0.05, (t - lastT) / 1000); lastT = t;
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5) { fpsShown = floor(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0;
    document.getElementById("s-fps").textContent = pad3(fpsShown); }
  const tt = t / 1000;
  for (const f of floaters) {
    const fx = sin(tt * f.s + f.p) * f.a, fy = cos(tt * f.s * 0.8 + f.p * 1.7) * f.a;
    if (f.isDot) f.el.style.transform = `translate(${f.bx + fx}px, ${f.by + fy}px) translate(-50%,-50%)`;
    else f.el.style.transform = `translate(${fx}px, ${fy}px)`;
  }
  drawStars(tt);
  requestAnimationFrame(frameLoop);
}

/* ── navigation ──────────────────────────────────────────── */
let zoomLock = 0;
function zoomIn(node, fromRect) {
  if (performance.now() < zoomLock) return;
  zoomLock = performance.now() + 350;
  const from = fromRect || { cx: innerWidth / 2, cy: innerHeight / 2, w: 160 };
  pendingZoomFrom = from;
  path.push(node);
  world.style.opacity = 0;
  setTimeout(() => { render(); world.style.opacity = 1; }, 130);
}
function zoomOut() {
  if (path.length < 2 || performance.now() < zoomLock) return;
  zoomLock = performance.now() + 350;
  const node = path.pop();
  const r = cardEl ? cardEl.getBoundingClientRect() : null;
  pendingLandNode = node;
  pendingLandRect = r ? { cx: r.left + r.width / 2, cy: r.top + r.height / 2, w: r.width } : null;
  world.style.opacity = 0;
  setTimeout(() => { render(); world.style.opacity = 1; }, 130);
}
let pendingLandRect = null;
function nodeById(id) {
  const focus = path[path.length - 1];
  const kids = childrenOf(focus);
  const direct = kids.find(k => k.id === id); if (direct) return direct;
  for (const k of kids) { const g = childrenOf(k).find(g2 => g2.id === id); if (g) return g; }
  return null;
}
world.addEventListener("click", e => {
  const t = e.target.closest("[data-node]");
  if (t) {
    const node = nodeById(+t.dataset.node);
    if (node) {
      const rect = t.getBoundingClientRect();
      zoomIn(node, { cx: rect.left + rect.width / 2, cy: rect.top + rect.height / 2, w: rect.width });
    }
    return;
  }
  if (!e.target.closest(".card")) zoomOut();
});
addEventListener("wheel", e => {
  if (performance.now() < zoomLock) return;
  if (e.deltaY > 0) zoomOut();
  else { const h = document.querySelector(".frame:hover"); if (h) { const node = nodeById(+h.dataset.node);
    if (node) { const r = h.getBoundingClientRect();
      zoomIn(node, { cx: r.left + r.width / 2, cy: r.top + r.height / 2, w: r.width }); } } }
}, { passive: true });
addEventListener("keydown", e => { if (e.key === "Escape") zoomOut(); });
addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY;
  document.getElementById("s-ptr").textContent =
    String(e.clientX).padStart(3, "0") + "," + String(e.clientY).padStart(3, "0"); });

/* crumbs */
function renderCrumbs() {
  if (path.length < 2) { crumbsEl.innerHTML = ""; return; }
  crumbsEl.innerHTML = path.map((n, i) =>
    `<a data-i="${i}" class="${i === path.length - 1 ? "cur" : ""}">${n.name}</a>`).join(`<span class="sep">▸</span>`);
}
crumbsEl.addEventListener("click", e => {
  const a = e.target.closest("a"); if (!a) return;
  const i = +a.dataset.i; if (i === path.length - 1) return;
  path.length = i + 1; render();
});

/* ── live activity on the focused card ───────────────────── */
setInterval(() => {
  if (!cardNode || cardNode === ROOT || !cardEl || !document.contains(cardEl)) return;
  cardNode.progress = min(99.5, cardNode.progress + 0.4 + random() * 1.2);
  cardNode.tokens += floor(60 + random() * 380);
  cardNode.uptime += 1.4;
  if (random() < 0.4) { cardNode.log.push(mkLog(cardNode)); if (cardNode.log.length > 7) cardNode.log.shift(); }
  cardNode.thinkIdx = floor(random() * cardNode.thoughts.length);
  const keep = { tok: cardEl.querySelector("#tok"), upt: cardEl.querySelector("#upt"), pb: cardEl.querySelector("#pbar"),
    lg: cardEl.querySelector("#log"), tk: cardEl.querySelector("#think"), ts: cardEl.querySelector("#tasks") };
  if (keep.tok) keep.tok.textContent = fmtTok(cardNode.tokens);
  if (keep.upt) keep.upt.textContent = fmtUp(cardNode.uptime);
  if (keep.tk) keep.tk.innerHTML = cardNode.thoughts.map((t, i) => `<div${i === cardNode.thinkIdx ? ' class="cur"' : ""}>${t}</div>`).join("");
  if (keep.ts) keep.ts.innerHTML = cardNode.tasks.map((t, i) => {
    const done = i < floor(cardNode.tasks.length * cardNode.progress / 100);
    const cur = !done && i === floor(cardNode.tasks.length * cardNode.progress / 100);
    return `<div class="task ${done ? "done" : cur ? "cur" : ""}"><span class="bx">[${done ? "×" : cur ? "▶" : " "}]</span> ${t}</div>`;
  }).join("");
  if (keep.pb) { const p = floor(cardNode.progress), on = floor(p / 4);
    keep.pb.innerHTML = "▓".repeat(on) + `<span class="off">` + "░".repeat(25 - on) + `</span> ${pad3(p)}%`; }
  if (keep.lg) keep.lg.innerHTML = cardNode.log.slice(-7).map(l => `<div><span class="ts">${l.ts}</span> ${l.s}</div>`).join("");
}, 1200);

/* ── starfield ───────────────────────────────────────────── */
const cv = document.getElementById("stars"), cx2 = cv.getContext("2d");
let stars = [];
function seedStars() {
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
  cx2.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  const r = mulberry32(42); stars = [];
  const n = floor(innerWidth * innerHeight / 6500);
  for (let i = 0; i < n; i++) stars.push({ x: r() * innerWidth, y: r() * innerHeight, z: 0.25 + r() * 0.75,
    s: r() < 0.06 ? 1.6 : r() < 0.3 ? 1.1 : 0.7, tw: r() * 6.28, g: r() });
}
function drawStars(t) {
  cx2.clearRect(0, 0, innerWidth, innerHeight);
  const ox = (mouse.x - innerWidth / 2) / innerWidth, oy = (mouse.y - innerHeight / 2) / innerHeight;
  for (const s of stars) {
    const px = s.x + ox * s.z * 34 + sin(t * 0.05 * s.z + s.g * 9) * 3;
    const py = s.y + oy * s.z * 34 + cos(t * 0.04 * s.z + s.g * 7) * 3;
    const tw = REDUCED ? 0.5 : 0.35 + 0.4 * (0.5 + 0.5 * sin(t * (0.6 + s.g) + s.tw * 6));
    cx2.globalAlpha = tw * s.z * 0.55;
    cx2.fillStyle = s.g > 0.9 ? "#46ff7d" : s.g > 0.8 ? "#ff5fd2" : "#8a8a8a";
    cx2.fillRect(px, py, s.s, s.s);
  }
  cx2.globalAlpha = 1;
}
let rsTimer = 0;
addEventListener("resize", () => { clearTimeout(rsTimer);
  rsTimer = setTimeout(() => { seedStars(); render(); }, 160); });

/* ── boot ────────────────────────────────────────────────── */
/* landing animation keyframes injected here (needs --lx/--ly/--ls) */
const st = document.createElement("style");
st.textContent = `.ni.land { animation: landIn .5s cubic-bezier(.22,.9,.26,1) both; animation-delay: 0ms; }
@keyframes landIn { from { opacity: .2; transform: translate(var(--lx,0), var(--ly,0)) scale(var(--ls,3)); } }`;
document.head.appendChild(st);
seedStars();
render();
requestAnimationFrame(frameLoop);

/* deep-link: #z=N descends N levels, #u=M then ascends M (also the test hook) */
(function autoDemo() {
  const h = new URLSearchParams(location.hash.slice(1));
  const z = +h.get("z") || 0, u = +h.get("u") || 0;
  if (!z && !u) return;
  let step = 0;
  const t = setInterval(() => {
    if (step < z) { const kids = childrenOf(path[path.length - 1]); zoomIn(kids[0], null); }
    else if (step < z + u) zoomOut();
    else { clearInterval(t); return; }
    step++;
  }, 430);
})();
</script>
</body>
